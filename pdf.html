<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 스튜디오 | 분리 · 병합 · 편집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<style>
:root{
  --bg:#0b1220;
  --bg-soft:#0f1930;
  --panel:#131f38;
  --panel-2:#182a4a;
  --line:#233256;
  --line-soft:#1c2a48;
  --text:#e9edf7;
  --text-dim:#9fb0cf;
  --text-mute:#6d7fa3;
  --gold:#d3a94c;
  --gold-dim:#a9853a;
  --blue:#5a8dff;
  --red:#e2637a;
  --green:#4fbf8b;
  --radius:10px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font);
  background:
    radial-gradient(1200px 500px at 15% -10%, #17264a 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #142140 0%, transparent 55%),
    var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#26375f;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

.app{display:flex;flex-direction:column;min-height:100vh;}

/* Header */
header.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(19,31,56,.9),rgba(19,31,56,.55));
  backdrop-filter:blur(6px);position:sticky;top:0;z-index:50;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--gold),#8a6a24);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#1a1305;font-size:15px;box-shadow:var(--shadow);
}
.brand h1{font-size:16px;font-weight:700;margin:0;letter-spacing:.2px;}
.brand span{display:block;font-size:11px;color:var(--text-mute);font-weight:500;margin-top:1px;}

nav.tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:12px;border:1px solid var(--line);}
nav.tabs button{
  appearance:none;border:0;background:transparent;color:var(--text-dim);
  padding:9px 18px;border-radius:9px;font-family:var(--font);font-weight:600;font-size:13.5px;
  cursor:pointer;transition:.15s;
}
nav.tabs button:hover{color:var(--text);}
nav.tabs button.active{background:linear-gradient(135deg,var(--gold),#b6892f);color:#1a1305;box-shadow:0 4px 14px rgba(211,169,76,.25);}

main{flex:1;padding:26px 28px 40px;}
.panel{display:none;max-width:1400px;margin:0 auto;}
/* The embedded editor is a full-app layout; give it the whole area below the
   header so its own internal toolbar/rails/stage size correctly. */
.panel-edit-frame{max-width:none;margin:0;}
.panel-edit-frame.active{position:fixed;left:0;right:0;top:71px;bottom:0;z-index:20;}
#pdfEditorRoot{position:absolute;inset:0;}
.panel.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.section-title{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;}
.section-title h2{font-size:19px;margin:0;font-weight:700;}
.section-title p{margin:0;color:var(--text-mute);font-size:12.5px;}

/* Card / dropzone */
.card{
  background:linear-gradient(180deg,var(--panel),var(--bg-soft));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);
}
.dropzone{
  border:1.5px dashed #2c3f6b;border-radius:12px;padding:34px 20px;
  text-align:center;cursor:pointer;transition:.15s;background:rgba(90,141,255,.03);
}
.dropzone:hover,.dropzone.drag{border-color:var(--gold);background:rgba(211,169,76,.06);}
.dropzone .ic{font-size:30px;margin-bottom:8px;}
.dropzone b{color:var(--text);}
.dropzone small{display:block;color:var(--text-mute);margin-top:4px;font-size:11.5px;}

.btn{
  appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--text);
  padding:10px 16px;border-radius:8px;font-family:var(--font);font-weight:600;font-size:13px;
  cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{background:#1f3257;border-color:#33477a;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.primary{background:linear-gradient(135deg,var(--gold),#b6892f);color:#1a1305;border:0;}
.btn.primary:hover{filter:brightness(1.08);}
.btn.danger{background:rgba(226,99,122,.12);border-color:rgba(226,99,122,.4);color:#f0a9b7;}
.btn.danger:hover{background:rgba(226,99,122,.22);}
.btn.ghost{background:transparent;}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:7px;}

/* SPLIT TAB */
.split-layout{display:grid;grid-template-columns:1fr 380px;gap:20px;margin-top:18px;align-items:start;}
.file-info{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:12px 14px;background:var(--panel-2);border-radius:8px;border:1px solid var(--line-soft);font-size:13px;}
.file-info b{color:var(--gold);}
.range-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.range-row{
  display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;
  background:var(--panel-2);border:1px solid var(--line-soft);padding:10px 12px;border-radius:9px;
}
.range-row .lbl{font-size:11px;color:var(--text-mute);display:block;margin-bottom:3px;}
.range-row input[type=number]{
  width:100%;background:var(--bg-soft);border:1px solid var(--line);color:var(--text);
  padding:8px 9px;border-radius:6px;font-family:var(--font);font-size:13.5px;
}
.range-row .arrow{color:var(--text-mute);font-size:16px;padding-top:14px;}
.range-row .rm{color:var(--text-mute);background:transparent;border:0;cursor:pointer;font-size:16px;padding-top:12px;}
.range-row .rm:hover{color:var(--red);}
.range-badge{font-size:10.5px;color:var(--gold);font-weight:700;background:rgba(211,169,76,.12);padding:2px 7px;border-radius:20px;display:inline-block;margin-bottom:6px;}

.result-panel{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:9px;padding:14px;font-size:13px;color:var(--text-dim);}
.result-panel h3{margin:0 0 10px;font-size:13px;color:var(--text);}
.preview-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto;padding-right:4px;}
.preview-item{display:flex;justify-content:space-between;align-items:center;background:var(--bg-soft);border:1px solid var(--line-soft);border-radius:7px;padding:8px 10px;font-size:12.5px;}
.preview-item b{color:var(--text);}

/* MERGE TAB */
.merge-toolbar{display:flex;justify-content:space-between;align-items:center;margin:16px 0;}
.merge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;min-height:80px;}
.merge-card{
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;
  cursor:grab;position:relative;transition:.15s;user-select:none;
}
.merge-card.dragging{opacity:.35;}
.merge-card.dragover{outline:2px solid var(--gold);outline-offset:-2px;}
.merge-card .thumb-wrap{aspect-ratio:3/4;background:#0a1120;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.merge-card canvas,.merge-card img{width:100%;height:100%;object-fit:contain;}
.merge-card .order{
  position:absolute;top:6px;left:6px;background:var(--gold);color:#1a1305;font-weight:800;
  font-size:11px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
}
.merge-card .rm{position:absolute;top:6px;right:6px;background:rgba(10,17,32,.75);border:0;color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px;}
.merge-card .rm:hover{background:var(--red);}
.merge-card .name{padding:8px 10px;font-size:11.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--line-soft);}

/* EDIT TAB */
.edit-shell{display:none;margin-top:12px;grid-template-columns:140px 48px 1fr 250px;gap:10px;height:calc(100vh - 150px);min-height:640px;}
.edit-shell.active{display:grid;}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;padding:10px;min-height:0;min-width:0;}
.rail h4{margin:2px 4px 10px;font-size:11.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.5px;}
.page-thumb{border:2px solid transparent;border-radius:8px;overflow:hidden;margin-bottom:10px;cursor:pointer;background:#0a1120;position:relative;}
.page-thumb.active{border-color:var(--gold);}
.page-thumb canvas{width:100%;display:block;}
.page-thumb .pn{position:absolute;bottom:4px;right:6px;font-size:10px;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:8px;}

.toolrail{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;padding:10px 6px;gap:6px;overflow:visible;min-height:0;min-width:0;}
.tool-btn{
  width:40px;height:40px;border-radius:9px;border:1px solid var(--line-soft);background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;position:relative;color:var(--text);
}
.tool-btn:hover{border-color:var(--gold);}
.tool-btn.active{background:linear-gradient(135deg,var(--gold),#b6892f);border-color:transparent;}
.tool-btn .tip{
  position:absolute;left:48px;top:50%;transform:translateY(-50%);background:#0a1120;border:1px solid var(--line);
  padding:5px 9px;border-radius:6px;font-size:11.5px;white-space:nowrap;opacity:0;pointer-events:none;transition:.12s;z-index:80;
  color:var(--text);box-shadow:var(--shadow);
}
.tool-btn:hover .tip{opacity:1;}
.toolrail hr{width:70%;border:0;border-top:1px solid var(--line-soft);margin:4px 0;}

.canvas-wrap{background:#0a1120;border:1px solid var(--line);border-radius:var(--radius);overflow:auto;position:relative;display:flex;padding:12px;min-height:0;min-width:0;}
.stage{position:relative;box-shadow:0 12px 40px rgba(0,0,0,.5);background:#fff;flex-shrink:0;height:fit-content;margin:auto;}
.stage canvas.page-canvas{display:block;}
.obj-layer{position:absolute;left:0;top:0;}
.edit-obj{position:absolute;box-sizing:border-box;cursor:move;}
.edit-obj.selected{outline:1.5px solid var(--blue);z-index:5;}
.edit-obj .txt{width:100%;height:100%;outline:none;overflow:visible;white-space:pre;}
.handle{position:absolute;width:9px;height:9px;background:#fff;border:1.5px solid var(--blue);border-radius:2px;z-index:6;}
.handle.nw{left:-5px;top:-5px;cursor:nwse-resize;}
.handle.ne{right:-5px;top:-5px;cursor:nesw-resize;}
.handle.sw{left:-5px;bottom:-5px;cursor:nesw-resize;}
.handle.se{right:-5px;bottom:-5px;cursor:nwse-resize;}

.zoombar{position:absolute;right:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:20px;display:flex;align-items:center;gap:6px;padding:5px 10px;box-shadow:var(--shadow);}
.zoombar button{width:24px;height:24px;border-radius:50%;border:0;background:var(--panel-2);color:var(--text);cursor:pointer;font-size:13px;}
.zoombar span{font-size:12px;color:var(--text-dim);width:42px;text-align:center;}

.prop{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;padding:16px;min-height:0;min-width:0;}
.prop h4{margin:0 0 12px;font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.4px;}
.prop .empty{color:var(--text-mute);font-size:12.5px;line-height:1.7;text-align:center;padding:30px 10px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;}
.field textarea,.field input[type=text],.field input[type=number],.field select{
  width:100%;background:var(--bg-soft);border:1px solid var(--line);color:var(--text);
  padding:8px 9px;border-radius:7px;font-family:var(--font);font-size:13px;
}
.field textarea{resize:vertical;min-height:56px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-dim);}
.chk input{width:15px;height:15px;accent-color:var(--gold);}
.toggle-btns{display:flex;gap:5px;}
.toggle-btns button{flex:1;padding:7px 4px;border-radius:6px;border:1px solid var(--line);background:var(--bg-soft);color:var(--text-dim);cursor:pointer;font-size:12.5px;font-weight:700;}
.toggle-btns button.on{background:var(--gold);color:#1a1305;border-color:transparent;}
input[type=color]{-webkit-appearance:none;width:34px;height:30px;border:1px solid var(--line);border-radius:6px;background:none;padding:0;cursor:pointer;}
input[type=color]::-webkit-color-swatch{border:0;border-radius:5px;}
.color-row{display:flex;align-items:center;gap:8px;}
input[type=range]{width:100%;accent-color:var(--gold);}
.range-val{font-size:11px;color:var(--text-mute);text-align:right;}

.upload-hint{color:var(--text-mute);font-size:12.5px;margin-top:4px;}
.hidden{display:none !important;}
.small{font-size:11.5px;color:var(--text-mute);}
.top-actions{display:flex;gap:8px;align-items:center;}
.edit-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
.edit-toolbar .fname{font-size:13px;color:var(--text-dim);}
.edit-toolbar .fname b{color:var(--gold);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);
  padding:12px 20px;border-radius:9px;box-shadow:var(--shadow);font-size:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none;
  max-width:min(560px,88vw);text-align:center;line-height:1.5;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.footer-del{display:flex;justify-content:flex-end;margin-top:14px;}
input[type=file]{display:none;}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#1a1305;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark">PDF</div>
      <div>
        <h1>PDF 스튜디오</h1>
        <span>분리 · 병합 · 편집</span>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="split">PDF 파일 분리</button>
      <button class="tab-btn" data-tab="merge">PDF 파일 병합</button>
      <button class="tab-btn" data-tab="edit">PDF 편집</button>
    </nav>
  </header>

  <main>
    <!-- ===================== SPLIT ===================== -->
    <section class="panel active" id="panel-split">
      <div class="section-title"><h2>PDF 파일 분리</h2><p>페이지 구간을 지정해 여러 개의 PDF 파일로 나눕니다</p></div>
      <div class="card">
        <div class="dropzone" id="splitDrop">
          <div class="ic">📄</div>
          <b>클릭하거나 PDF 파일을 여기로 드래그하세요</b>
          <small>1개의 PDF 파일만 업로드할 수 있습니다</small>
        </div>
        <input type="file" id="splitInput" accept="application/pdf">
        <div class="file-info hidden" id="splitFileInfo">
          <span>📎 <b id="splitFileName"></b> · 총 <b id="splitTotalPages"></b>페이지</span>
          <button class="btn sm ghost" id="splitReset">다시 선택</button>
        </div>
      </div>

      <div class="split-layout hidden" id="splitLayout">
        <div class="card">
          <div class="section-title" style="margin-bottom:10px;"><h2 style="font-size:15px;">분리 구간</h2></div>
          <div class="range-list" id="rangeList"></div>
          <div style="margin-top:14px;display:flex;gap:8px;">
            <button class="btn" id="addRangeBtn">➕ 페이지 분리 추가</button>
          </div>
        </div>
        <div class="card">
          <h3 style="margin:0 0 12px;font-size:15px;">분리 결과 미리보기</h3>
          <div class="preview-list" id="splitPreviewList"></div>
          <button class="btn primary" id="doSplitBtn" style="width:100%;margin-top:16px;justify-content:center;">⇩ 분리하여 다운로드 (ZIP)</button>
        </div>
      </div>
    </section>

    <!-- ===================== MERGE ===================== -->
    <section class="panel" id="panel-merge">
      <div class="section-title"><h2>PDF 파일 병합</h2><p>여러 개의 PDF 파일을 원하는 순서로 드래그하여 하나로 합칩니다</p></div>
      <div class="card">
        <div class="dropzone" id="mergeDrop">
          <div class="ic">🗂️</div>
          <b>클릭하거나 여러 PDF 파일을 여기로 드래그하세요</b>
          <small>2개 이상의 PDF 파일을 업로드하세요</small>
        </div>
        <input type="file" id="mergeInput" accept="application/pdf" multiple>
      </div>
      <div class="merge-toolbar hidden" id="mergeToolbar">
        <div class="small" id="mergeCount">0개 파일</div>
        <div class="top-actions">
          <button class="btn ghost sm" id="mergeClear">전체 삭제</button>
          <button class="btn primary" id="mergeBtn">⇩ 순서대로 병합하여 다운로드</button>
        </div>
      </div>
      <div class="merge-grid" id="mergeGrid" style="margin-top:16px;"></div>
    </section>

    <!-- ===================== EDIT ===================== -->
    <section class="panel panel-edit-frame" id="panel-edit">
      <div id="pdfEditorRoot"></div>
    </section>
  </main>
</div>

<input type="file" id="imageFileInput" accept="image/png,image/jpeg" style="display:none;">
<div class="toast" id="toast"></div>

<script>
// ===== Embedded PDF editor (isolated via Shadow DOM) =====
// The editor is the user's own standalone file. To keep it a TOP-LEVEL document
// (so window.queryLocalFonts works when served over http/https) while preventing
// its CSS class names and globals from colliding with the split/merge tool, we

function _b64ToUtf8(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
let _editorLoaded = false;
function ensureEditorFrameLoaded(){
  if(_editorLoaded) return;
  _editorLoaded = true;
  try{
    const host = document.getElementById('pdfEditorRoot');
    const root = host.attachShadow({mode:'open'});
    const style = document.createElement('style');
    style.textContent = _b64ToUtf8(PDFEDITOR_CSS_B64);
    root.appendChild(style);
    const wrap = document.createElement('div');
    wrap.className = 'pdfed-wrap';
    wrap.innerHTML = _b64ToUtf8(PDFEDITOR_BODY_B64);
    root.appendChild(wrap);
    // Run the editor script. It expects window.pdfjsLib and window.PDFLib, which
    // the parent document already loaded, and it resolves DOM lookups against the
    // shadow root via the __root shim baked into the code.
    const run = new Function(_b64ToUtf8(PDFEDITOR_JS_B64));
    run();
  }catch(err){
    console.error('편집기 로드 실패:', err);
  }
}

<script>
'use strict';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ============================================================
   Utilities
============================================================ */
function toast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), ms||2200);
}
window.addEventListener('error', (e)=>{
  console.error('전역 오류:', e.error || e.message);
});
window.addEventListener('unhandledrejection', (e)=>{
  console.error('처리되지 않은 Promise 오류:', e.reason);
  toast('예기치 못한 오류: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)), 6000);
});
function uid(){ return 'o'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function fileToArrayBuffer(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = ()=>rej(new Error('파일을 읽는 중 오류가 발생했습니다.'));
    r.readAsArrayBuffer(file);
  });
}
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = ()=>rej(new Error('파일을 읽는 중 오류가 발생했습니다.'));
    r.readAsDataURL(file);
  });
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
}
function sanitizeName(name){
  return (name||'document').replace(/\.pdf$/i,'').replace(/[\\/:*?"<>|]/g,'_').slice(0,80) || 'document';
}
function escapeText(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

/* ============================================================
   Tabs
============================================================ */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab === 'edit') ensureEditorFrameLoaded();
  });
});
// If the person reloads with the edit tab already marked active, or lands
// there first, still load it.
if(document.querySelector('.tab-btn[data-tab="edit"]').classList.contains('active')){
  ensureEditorFrameLoaded();
}

/* ============================================================
   Dropzone generic wiring
============================================================ */
function wireDrop(dropEl, inputEl, onFiles){
  dropEl.addEventListener('click', ()=>inputEl.click());
  dropEl.addEventListener('dragover', e=>{ e.preventDefault(); dropEl.classList.add('drag'); });
  dropEl.addEventListener('dragleave', ()=> dropEl.classList.remove('drag'));
  dropEl.addEventListener('drop', e=>{
    e.preventDefault(); dropEl.classList.remove('drag');
    const files = Array.from(e.dataTransfer.files).filter(f=>f.type==='application/pdf' || /\.pdf$/i.test(f.name));
    if(files.length) onFiles(files);
  });
  inputEl.addEventListener('change', e=>{
    const files = Array.from(e.target.files);
    if(files.length) onFiles(files);
    inputEl.value = '';
  });
}

/* ============================================================
   SPLIT TAB
============================================================ */
const SplitState = { file:null, bytes:null, totalPages:0, ranges:[] };

wireDrop(document.getElementById('splitDrop'), document.getElementById('splitInput'), async (files)=>{
  await loadSplitFile(files[0]);
});
document.getElementById('splitReset').addEventListener('click', ()=>{
  SplitState.file = null; SplitState.bytes = null; SplitState.totalPages = 0; SplitState.ranges = [];
  document.getElementById('splitFileInfo').classList.add('hidden');
  document.getElementById('splitLayout').classList.add('hidden');
  document.getElementById('splitDrop').classList.remove('hidden');
  document.getElementById('rangeList').textContent = '';
});

async function loadSplitFile(file){
  try{
    const buf = await fileToArrayBuffer(file);
    const doc = await pdfjsLib.getDocument({data: buf.slice(0)}).promise;
    SplitState.file = file;
    SplitState.bytes = buf;
    SplitState.totalPages = doc.numPages;
    SplitState.ranges = [];
    document.getElementById('splitFileName').textContent = file.name;
    document.getElementById('splitTotalPages').textContent = doc.numPages;
    document.getElementById('splitFileInfo').classList.remove('hidden');
    document.getElementById('splitLayout').classList.remove('hidden');
    document.getElementById('splitDrop').classList.add('hidden');
    addRange(); // start with one range prefilled
  }catch(err){
    console.error(err);
    toast('PDF 파일을 여는 중 오류가 발생했습니다. 올바른 PDF 파일인지 확인해주세요.');
  }
}

function addRange(){
  const last = SplitState.ranges[SplitState.ranges.length-1];
  let start = 1;
  if(last) start = clamp(last.end + 1, 1, SplitState.totalPages);
  const end = SplitState.totalPages;
  SplitState.ranges.push({ id: uid(), start, end });
  renderRanges();
}
document.getElementById('addRangeBtn').addEventListener('click', ()=>{
  if(!SplitState.totalPages) return;
  addRange();
});

function renderRanges(){
  const wrap = document.getElementById('rangeList');
  wrap.textContent = '';
  SplitState.ranges.forEach((r, idx)=>{
    const row = document.createElement('div');
    row.className = 'range-row';

    const startWrap = document.createElement('div');
    const sLbl = document.createElement('span'); sLbl.className='lbl';
    const badge = document.createElement('span'); badge.className='range-badge'; badge.textContent = (idx+1)+'번째 파일';
    sLbl.appendChild(badge); sLbl.appendChild(document.createElement('br')); sLbl.appendChild(document.createTextNode('시작 페이지'));
    const sInput = document.createElement('input');
    sInput.type='number'; sInput.min=1; sInput.max=SplitState.totalPages; sInput.value=r.start;
    sInput.addEventListener('input', ()=>{
      r.start = clamp(parseInt(sInput.value||'1',10), 1, SplitState.totalPages);
      renderPreview();
    });
    startWrap.appendChild(sLbl); startWrap.appendChild(sInput);

    const arrow = document.createElement('div'); arrow.className='arrow'; arrow.textContent='→';

    const endWrap = document.createElement('div');
    const eLbl = document.createElement('span'); eLbl.className='lbl'; eLbl.textContent='종료 페이지';
    const eInput = document.createElement('input');
    eInput.type='number'; eInput.min=1; eInput.max=SplitState.totalPages; eInput.value=r.end;
    eInput.addEventListener('input', ()=>{
      r.end = clamp(parseInt(eInput.value||'1',10), 1, SplitState.totalPages);
      renderPreview();
    });
    endWrap.appendChild(eLbl); endWrap.appendChild(eInput);

    const rm = document.createElement('button'); rm.className='rm'; rm.textContent='✕'; rm.title='구간 삭제';
    rm.addEventListener('click', ()=>{
      SplitState.ranges = SplitState.ranges.filter(x=>x.id!==r.id);
      renderRanges();
    });

    row.appendChild(startWrap); row.appendChild(arrow); row.appendChild(endWrap); row.appendChild(rm);
    wrap.appendChild(row);
  });
  renderPreview();
}

function computeSplitPlan(){
  // valid ranges only (start<=end, within bounds)
  const ranges = SplitState.ranges
    .map(r=>({start: clamp(r.start,1,SplitState.totalPages), end: clamp(r.end,1,SplitState.totalPages)}))
    .filter(r=>r.start<=r.end)
    .sort((a,b)=>a.start-b.start);
  const plan = ranges.map(r=>({start:r.start,end:r.end}));
  const lastEnd = ranges.length ? ranges[ranges.length-1].end : 0;
  if(lastEnd < SplitState.totalPages){
    plan.push({start: lastEnd+1, end: SplitState.totalPages});
  }
  return plan;
}

function renderPreview(){
  const list = document.getElementById('splitPreviewList');
  list.textContent = '';
  if(!SplitState.totalPages){ return; }
  const plan = computeSplitPlan();
  plan.forEach((p, i)=>{
    const item = document.createElement('div');
    item.className = 'preview-item';
    const left = document.createElement('span');
    left.innerHTML = '📄 파일 ' + (i+1) + (i===plan.length-1 && plan[i].__auto ? ' (자동)' : '');
    const right = document.createElement('b');
    right.textContent = p.start + ' ~ ' + p.end + ' 페이지 (' + (p.end-p.start+1) + '장)';
    item.appendChild(left); item.appendChild(right);
    list.appendChild(item);
  });
}

document.getElementById('doSplitBtn').addEventListener('click', async ()=>{
  if(!SplitState.bytes){ toast('먼저 PDF 파일을 업로드해주세요.'); return; }
  const plan = computeSplitPlan();
  if(!plan.length){ toast('분리할 구간이 없습니다.'); return; }
  const btn = document.getElementById('doSplitBtn');
  btn.disabled = true; const orig = btn.textContent; btn.innerHTML = '<span class="spinner"></span> 처리 중...';
  try{
    const { PDFDocument } = PDFLib;
    const srcDoc = await PDFDocument.load(SplitState.bytes.slice(0));
    const baseName = sanitizeName(SplitState.file.name);
    const zip = new JSZip();
    for(let i=0;i<plan.length;i++){
      const p = plan[i];
      const newDoc = await PDFDocument.create();
      const indices = [];
      for(let pg=p.start; pg<=p.end; pg++) indices.push(pg-1);
      const copied = await newDoc.copyPages(srcDoc, indices);
      copied.forEach(pg=>newDoc.addPage(pg));
      const bytes = await newDoc.save();
      zip.file(`${baseName}_${String(i+1).padStart(2,'0')}_(${p.start}-${p.end}).pdf`, bytes);
    }
    if(plan.length === 1){
      const only = await (async()=>{
        const newDoc = await PDFDocument.create();
        const indices=[]; for(let pg=plan[0].start; pg<=plan[0].end; pg++) indices.push(pg-1);
        const copied = await newDoc.copyPages(srcDoc, indices);
        copied.forEach(pg=>newDoc.addPage(pg));
        return await newDoc.save();
      })();
      downloadBlob(new Blob([only],{type:'application/pdf'}), `${baseName}_(${plan[0].start}-${plan[0].end}).pdf`);
    } else {
      const content = await zip.generateAsync({type:'blob'});
      downloadBlob(content, `${baseName}_분리결과.zip`);
    }
    toast('PDF 분리가 완료되었습니다.');
  }catch(err){
    console.error(err);
    toast('분리 중 오류가 발생했습니다: ' + err.message);
  }finally{
    btn.disabled = false; btn.textContent = orig;
  }
});

/* ============================================================
   MERGE TAB
============================================================ */
const MergeState = { items: [] }; // {id,file,bytes,thumbCanvas}

wireDrop(document.getElementById('mergeDrop'), document.getElementById('mergeInput'), async (files)=>{
  for(const f of files) await addMergeFile(f);
  renderMergeGrid();
});

async function addMergeFile(file){
  try{
    const buf = await fileToArrayBuffer(file);
    const doc = await pdfjsLib.getDocument({data: buf.slice(0)}).promise;
    const page = await doc.getPage(1);
    const viewport = page.getViewport({scale: 1});
    const scale = 220 / viewport.width;
    const vp = page.getViewport({scale});
    const canvas = document.createElement('canvas');
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({canvasContext: canvas.getContext('2d'), viewport: vp}).promise;
    MergeState.items.push({ id: uid(), file, bytes: buf, thumb: canvas, pages: doc.numPages });
  }catch(err){
    console.error(err);
    toast(`"${file.name}" 파일을 여는 중 오류가 발생했습니다.`);
  }
}

function renderMergeGrid(){
  const grid = document.getElementById('mergeGrid');
  grid.textContent = '';
  MergeState.items.forEach((item, idx)=>{
    const card = document.createElement('div');
    card.className = 'merge-card';
    card.draggable = true;
    card.dataset.id = item.id;

    const order = document.createElement('div'); order.className='order'; order.textContent = idx+1;
    const rm = document.createElement('button'); rm.className='rm'; rm.textContent='✕';
    rm.addEventListener('click', ()=>{
      MergeState.items = MergeState.items.filter(x=>x.id!==item.id);
      renderMergeGrid();
    });
    const thumbWrap = document.createElement('div'); thumbWrap.className='thumb-wrap';
    thumbWrap.appendChild(item.thumb);
    const name = document.createElement('div'); name.className='name'; name.textContent = item.file.name + ` (${item.pages}p)`;

    card.appendChild(order); card.appendChild(rm); card.appendChild(thumbWrap); card.appendChild(name);

    card.addEventListener('dragstart', e=>{ card.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', item.id); });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
    card.addEventListener('dragover', e=>{ e.preventDefault(); card.classList.add('dragover'); });
    card.addEventListener('dragleave', ()=> card.classList.remove('dragover'));
    card.addEventListener('drop', e=>{
      e.preventDefault(); card.classList.remove('dragover');
      const draggedId = e.dataTransfer.getData('text/plain');
      if(draggedId === item.id) return;
      const from = MergeState.items.findIndex(x=>x.id===draggedId);
      const to = MergeState.items.findIndex(x=>x.id===item.id);
      if(from<0 || to<0) return;
      const [moved] = MergeState.items.splice(from,1);
      MergeState.items.splice(to,0,moved);
      renderMergeGrid();
    });

    grid.appendChild(card);
  });
  document.getElementById('mergeToolbar').classList.toggle('hidden', MergeState.items.length===0);
  document.getElementById('mergeCount').textContent = MergeState.items.length + '개 파일';
}

document.getElementById('mergeClear').addEventListener('click', ()=>{
  MergeState.items = []; renderMergeGrid();
});

document.getElementById('mergeBtn').addEventListener('click', async ()=>{
  if(MergeState.items.length < 2){ toast('병합하려면 2개 이상의 PDF 파일이 필요합니다.'); return; }
  const btn = document.getElementById('mergeBtn');
  btn.disabled = true; const orig = btn.textContent; btn.innerHTML = '<span class="spinner"></span> 병합 중...';
  try{
    const { PDFDocument } = PDFLib;
    const outDoc = await PDFDocument.create();
    for(const item of MergeState.items){
      const src = await PDFDocument.load(item.bytes.slice(0));
      const indices = src.getPageIndices();
      const copied = await outDoc.copyPages(src, indices);
      copied.forEach(p=>outDoc.addPage(p));
    }
    const bytes = await outDoc.save();
    downloadBlob(new Blob([bytes],{type:'application/pdf'}), 'merged_document.pdf');
    toast('PDF 병합이 완료되었습니다.');
  }catch(err){
    console.error(err);
    toast('병합 중 오류가 발생했습니다: ' + err.message);
  }finally{
    btn.disabled = false; btn.textContent = orig;
  }
});

</script>
