<!DOCTYPE html>
<html lang="ko" data-theme="white">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="HD교육컨설팅 · hhd77@hanmail.net">
<title>HTML Studio · 비주얼 HTML 편집기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script>
/* 테마 깜빡임 방지: 저장된 테마를 가장 먼저 적용 */
(function(){try{var t=localStorage.getItem('htmlStudio.theme');if(t==='navy'||t==='white')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
:root{
  --bg:#eef1f6;--panel:#ffffff;--panel-2:#f7f9fc;--border:#e1e6ee;--border-strong:#cdd5e1;
  --text:#172033;--muted:#667389;--faint:#9aa5b5;
  --accent:#1d3b8b;--accent-h:#163070;--accent-2:#2f5bd3;--accent-soft:#eaf0fd;
  --hover:#f1f4f9;--active:#e4eaf5;--danger:#d64545;--danger-soft:#fdecec;--ok:#1f9d6a;
  --canvas:#e3e8ef;--input:#ffffff;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 6px 24px rgba(15,23,42,.10);
  --shadow-lg:0 24px 64px rgba(15,23,42,.24);
  --topbar:#ffffff;--tip:#0f1f45;
  --font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --mono:"JetBrains Mono","D2Coding",Consolas,"Courier New",monospace;
  color-scheme:light;
}
html[data-theme="navy"]{
  --bg:#07101f;--panel:#0c1830;--panel-2:#10203f;--border:#1b2e57;--border-strong:#294476;
  --text:#e3eaf6;--muted:#93a3c2;--faint:#62739a;
  --accent:#4f86ff;--accent-h:#6a9aff;--accent-2:#7fa8ff;--accent-soft:rgba(79,134,255,.17);
  --hover:#142851;--active:#1a3365;--danger:#ff6b6b;--danger-soft:rgba(255,107,107,.14);--ok:#3ccf91;
  --canvas:#050c19;--input:#091429;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --shadow-lg:0 24px 64px rgba(0,0,0,.6);
  --topbar:#0a152b;--tip:#1f3d7a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.1px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.ic{display:inline-grid;place-items:center;line-height:0}
.ic svg{width:16px;height:16px}
.hidden{display:none!important}
.mono{font-family:var(--mono)}

/* ===== 앱 레이아웃 ===== */
.app{display:grid;grid-template-rows:58px auto minmax(0,1fr) 30px;height:100vh;--lw:250px;--rw:340px}
.app.hide-left{--lw:0px}
.app.hide-right{--rw:0px}

/* ===== 상단바 ===== */
.topbar{display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--topbar);border-bottom:1px solid var(--border);min-width:0}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1d3b8b 0%,#3b6ee6 100%);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(29,59,139,.35)}
.brand-mark svg{width:18px;height:18px}
.brand-title{font-weight:800;font-size:15px;letter-spacing:-.3px;line-height:1.1}
.brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:.2px}
.docname{display:flex;align-items:center;gap:6px;min-width:0;max-width:260px;padding-left:14px;border-left:1px solid var(--border)}
.docname input{border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 8px;font-weight:600;width:100%;min-width:60px;outline:none}
.docname input:hover{border-color:var(--border)}
.docname input:focus{border-color:var(--accent-2);background:var(--input)}
.dirty-dot{width:7px;height:7px;border-radius:50%;background:#f59e0b;flex-shrink:0;opacity:0;transition:opacity .2s}
.dirty-dot.on{opacity:1}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:7px;color:var(--muted);font-weight:600;font-size:12.5px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow-sm)}
html[data-theme="navy"] .seg button.on{background:var(--active);color:#fff}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);font-weight:600;font-size:12.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--hover);border-color:var(--border-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent-h);border-color:var(--accent-h)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:28px;padding:0 9px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--danger)}
.btn.danger:hover:not(:disabled){background:var(--danger-soft);border-color:var(--danger)}
.btn .ic svg{width:15px;height:15px}
.top-actions{display:flex;align-items:center;gap:6px}

/* ===== 툴바 ===== */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border);position:relative;z-index:20}
.toolbar.off{opacity:.45;pointer-events:none}
.tg{display:flex;align-items:center;gap:2px;padding:0 7px;border-right:1px solid var(--border)}
.tg:last-child{border-right:0}
.tb{min-width:32px;height:32px;padding:0 6px;border:1px solid transparent;border-radius:7px;background:transparent;display:inline-grid;place-items:center;color:var(--text);position:relative;font-weight:700;font-size:12px}
.tb:hover:not(:disabled){background:var(--hover)}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.tb .sw{position:absolute;left:8px;right:8px;bottom:4px;height:3px;border-radius:2px;background:#000}
.tb .ic svg{width:17px;height:17px}
.tsel{height:32px;border:1px solid var(--border);border-radius:7px;background:var(--input);padding:0 6px;max-width:132px;outline:none}
.tsel:focus,.tnum:focus{border-color:var(--accent-2)}
.tnum{width:50px;height:32px;border:1px solid var(--border);border-radius:7px;background:var(--input);text-align:center;outline:none;-moz-appearance:textfield}
.tnum::-webkit-inner-spin-button{display:none}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--tip);color:#fff;font-size:11px;font-weight:500;padding:5px 8px;border-radius:6px;white-space:nowrap;z-index:300;pointer-events:none;box-shadow:var(--shadow)}

/* ===== 본문 3단 ===== */
.main{display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);min-height:0;transition:grid-template-columns .2s ease}
.panel{background:var(--panel);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.panel.left{border-right:1px solid var(--border)}
.panel.right{border-left:1px solid var(--border)}
.app.hide-left .panel.left,.app.hide-right .panel.right{border:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px 0 14px;height:44px;border-bottom:1px solid var(--border);font-weight:700;font-size:11.5px;letter-spacing:.5px;color:var(--muted);flex-shrink:0;white-space:nowrap}
.panel-b{flex:1;overflow:auto;min-height:0}
.icon-btn{width:28px;height:28px;border:0;background:transparent;border-radius:6px;color:var(--muted);display:inline-grid;place-items:center;flex-shrink:0}
.icon-btn:hover:not(:disabled){background:var(--hover);color:var(--text)}
.icon-btn.del:hover:not(:disabled){background:var(--danger-soft);color:var(--danger)}
.icon-btn .ic svg{width:15px;height:15px}

/* DOM 트리 */
.tree{padding:6px 0 24px;font-size:12px}
.tn{display:flex;align-items:center;gap:5px;height:25px;padding-right:10px;cursor:pointer;white-space:nowrap;border-left:2px solid transparent;font-family:var(--mono);font-size:11.5px}
.tn:hover{background:var(--hover)}
.tn.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.tn .tw{width:14px;height:14px;display:grid;place-items:center;color:var(--faint);flex-shrink:0;font-size:9px;transition:transform .15s}
.tn .tw.open{transform:rotate(90deg)}
.tn .tt{color:var(--accent-2);font-weight:700}
.tn .ti{color:#d97706}
.tn .tc{color:var(--muted)}
.tn .tx{color:var(--faint);overflow:hidden;text-overflow:ellipsis;font-family:var(--font);font-size:11.5px}
.tree-more{padding:8px 14px;color:var(--faint);font-size:11.5px}

/* ===== 캔버스 ===== */
.center{position:relative;min-width:0;min-height:0;background:var(--canvas);display:flex}
.canvas-wrap{flex:1;display:flex;justify-content:center;padding:20px;min-height:0;min-width:0;overflow:auto}
.page-frame{position:relative;width:100%;height:100%;min-height:360px;background:#fff;border-radius:6px;box-shadow:var(--shadow);overflow:hidden;transition:width .25s ease;flex-shrink:0}
.page-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:block}
.overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.sel-box{position:absolute;border:1.5px solid #2f5bd3;border-radius:2px;display:none;box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.sel-tag{position:absolute;top:-21px;left:-1.5px;background:#2f5bd3;color:#fff;font:600 10.5px/1 var(--mono);padding:5px 7px;border-radius:4px 4px 4px 0;white-space:nowrap}
.sel-box.inside .sel-tag{top:0;left:0;border-radius:0 0 4px 0}
.hover-box{position:absolute;border:1px dashed rgba(47,91,211,.6);display:none;background:rgba(47,91,211,.03)}
.hd{position:absolute;width:11px;height:11px;background:#fff;border:1.5px solid #2f5bd3;border-radius:3px;pointer-events:auto;display:none;margin:-5.5px 0 0 -5.5px;box-shadow:0 1px 3px rgba(0,0,0,.25);touch-action:none}
.hd[data-dir="nw"],.hd[data-dir="se"]{cursor:nwse-resize}
.hd[data-dir="ne"],.hd[data-dir="sw"]{cursor:nesw-resize}
.hd[data-dir="n"],.hd[data-dir="s"]{cursor:ns-resize}
.hd[data-dir="e"],.hd[data-dir="w"]{cursor:ew-resize}
.size-tip{position:absolute;background:#0f1f45;color:#fff;font:600 11px var(--mono);padding:4px 8px;border-radius:5px;display:none;white-space:nowrap;z-index:3}
.shield{position:fixed;inset:0;z-index:9000;display:none}

/* 소스/미리보기 */
.source-wrap,.preview-wrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.source-wrap{background:var(--panel)}
.sub-bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap}
.sub-bar .state{font-size:12px;color:var(--muted)}
.sub-bar .state.warn{color:#d97706;font-weight:600}
.code{flex:1;display:flex;min-height:0;font:12.5px/20px var(--mono)}
.gutter{padding:12px 10px 12px 8px;text-align:right;color:var(--faint);background:var(--panel-2);border-right:1px solid var(--border);overflow:hidden;user-select:none;min-width:52px;white-space:pre;font:inherit}
.code textarea{flex:1;border:0;outline:0;resize:none;padding:12px 14px;background:var(--panel);font:inherit;white-space:pre;overflow:auto;tab-size:2;color:var(--text)}
.preview-body{flex:1;padding:20px;display:flex;justify-content:center;min-height:0}
.preview-body iframe{width:100%;height:100%;border:0;background:#fff;border-radius:6px;box-shadow:var(--shadow);transition:width .25s}

/* ===== 속성 패널 ===== */
.tabs{display:flex;padding:0 10px;border-bottom:1px solid var(--border);flex-shrink:0;height:44px}
.tabs button{flex:1;border:0;background:transparent;font-weight:700;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.sec{border-bottom:1px solid var(--border)}
.sec-h{display:flex;align-items:center;gap:8px;padding:11px 14px;font-weight:700;font-size:12.5px;cursor:pointer;user-select:none}
.sec-h:hover{background:var(--hover)}
.sec-h .ic{color:var(--accent-2)}
.sec-h .chev{margin-left:auto;transition:transform .2s;color:var(--faint)}
.sec.closed .chev{transform:rotate(-90deg)}
.sec.closed .sec-b{display:none}
.sec-b{padding:2px 14px 14px}
.row{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:8px;margin-top:8px}
.row>label{color:var(--muted);font-size:12px;line-height:1.3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.inp{height:30px;border:1px solid var(--border);border-radius:7px;background:var(--input);padding:0 9px;width:100%;min-width:0;outline:none;font-size:12.5px}
.inp:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
select.inp{padding:0 5px}
textarea.inp{height:auto;padding:8px 9px;font-family:var(--mono);font-size:12px;line-height:1.55;resize:vertical}
.modal input[type=color]{width:46px;height:32px;padding:2px;border:1px solid var(--border);border-radius:7px;background:var(--input);cursor:pointer}
.color-f{display:flex;gap:5px;align-items:center;min-width:0}
.color-f input[type=color]{width:32px;height:30px;padding:2px;border:1px solid var(--border);border-radius:7px;background:var(--input);flex-shrink:0}
.btn-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.act-grid .btn{width:100%}
.kv{width:100%;border-collapse:collapse;margin-top:6px;table-layout:fixed}
.kv td{padding:2px;vertical-align:middle}
.kv td:first-child{width:38%}
.kv td:last-child{width:30px}
.kv .inp{height:28px;font-family:var(--mono);font-size:11.5px;padding:0 7px}
.kv .inp.handler{border-color:#f59e0b}
.kv .add td{padding-top:6px}
.el-head{padding:14px;border-bottom:1px solid var(--border);background:var(--panel-2)}
.el-title{display:flex;align-items:center;gap:8px;min-width:0}
.tagb{font:700 12px var(--mono);color:#fff;background:var(--accent);padding:4px 8px;border-radius:6px;flex-shrink:0}
.el-path{font:11px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el-actions{display:flex;gap:2px;margin-top:10px;flex-wrap:wrap}
.el-actions .icon-btn{border:1px solid var(--border);background:var(--panel);width:32px;height:30px}
.empty{padding:40px 22px;text-align:center;color:var(--muted);line-height:1.75}
.empty .big{width:54px;height:54px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
.empty .big svg{width:26px;height:26px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;user-select:none}
.chk input{accent-color:var(--accent);width:15px;height:15px}
.hint{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.55}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.sub-h{font-size:11.5px;font-weight:700;color:var(--muted);margin:14px 0 2px;letter-spacing:.3px}
.thumb{margin-top:8px;border:1px solid var(--border);border-radius:8px;padding:6px;background:var(--panel-2);text-align:center}
.thumb img{max-width:100%;max-height:120px;border-radius:4px}
.css-block{border:1px solid var(--border);border-radius:9px;margin-top:10px;overflow:hidden}
.css-block-h{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 4px 10px;background:var(--panel-2);font:600 11px var(--mono);color:var(--muted)}
.css-block textarea{border:0;border-radius:0;width:100%;min-height:120px}

/* ===== 상태바 ===== */
.statusbar{display:flex;align-items:center;gap:12px;padding:0 10px;background:var(--panel);border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);min-width:0}
.crumbs{display:flex;align-items:center;gap:1px;overflow:hidden;white-space:nowrap;flex:1;min-width:0}
.crumbs button{border:0;background:transparent;color:var(--muted);padding:2px 5px;border-radius:4px;font:11px var(--mono)}
.crumbs button:hover{background:var(--hover);color:var(--text)}
.crumbs button.cur{color:var(--accent);font-weight:700}
.crumbs .sep{color:var(--faint);font-size:10px}
.st-item{white-space:nowrap}
.seg.sm{padding:2px;border-radius:7px}
.seg.sm button{padding:2px 7px;font-size:11px;border-radius:5px}
.seg.sm .ic svg{width:13px;height:13px}

/* ===== 모달/팝오버/토스트 ===== */
.modal-bg{position:fixed;inset:0;background:rgba(6,12,28,.52);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:5000;padding:20px;animation:fade .15s ease}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;animation:pop .18s ease}
.modal.wide{width:min(860px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 18px 15px 20px;border-bottom:1px solid var(--border)}
.modal-h h3{margin:0;font-size:15px;font-weight:700;flex:1}
.modal-h .ic{color:var(--accent-2)}
.modal-b{padding:18px 20px;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:13px 20px;border-top:1px solid var(--border)}
.field{margin-bottom:14px}
.field>label{display:block;font-weight:600;font-size:12px;margin-bottom:6px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.m-tabs{display:flex;gap:4px;margin-bottom:14px}
.big-ta{width:100%;min-height:300px;font:12.5px/1.55 var(--mono)}
.drop-area{border:2px dashed var(--border-strong);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;background:var(--panel-2);transition:border-color .15s,background .15s}
.drop-area:hover,.drop-area.over{border-color:var(--accent-2);background:var(--accent-soft)}
.drop-area b{color:var(--accent)}
.files-list{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.files-list .fi{font-size:11.5px;padding:5px 9px;border-radius:7px;background:var(--panel-2);border:1px solid var(--border)}
.pop{position:fixed;z-index:6000;background:var(--panel);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow-lg);padding:10px;animation:pop .14s ease}
.palette{display:grid;grid-template-columns:repeat(10,20px);gap:4px}
.palette button{width:20px;height:20px;border-radius:4px;border:1px solid rgba(0,0,0,.14);padding:0}
.palette button:hover{transform:scale(1.18);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pal-row{display:flex;gap:6px;align-items:center;margin-top:10px}
.pal-label{font-size:11px;color:var(--muted);margin:8px 0 5px;font-weight:600}
.menu{padding:5px;min-width:210px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:7px 10px;border-radius:7px;text-align:left;font-size:12.5px}
.menu button:hover:not(:disabled){background:var(--hover)}
.menu button.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 3px}
.menu .k{margin-left:auto;color:var(--faint);font-size:11px;font-family:var(--mono)}
.menu .ic svg{width:15px;height:15px}
.toasts{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:7000;align-items:center;pointer-events:none}
.toast{background:#0f1f45;color:#fff;padding:10px 16px;border-radius:9px;box-shadow:var(--shadow-lg);font-size:12.5px;animation:pop .2s ease;max-width:80vw}
.toast.err{background:#b42318}
.toast.ok{background:#12704b}
.busy{position:fixed;inset:0;background:rgba(6,12,28,.45);display:flex;align-items:center;justify-content:center;z-index:8000;color:#fff;font-weight:600;gap:12px;flex-direction:column}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite}
.drop-hint{position:fixed;inset:12px;border:3px dashed var(--accent-2);border-radius:18px;background:rgba(47,91,211,.10);z-index:4000;display:none;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--accent);pointer-events:none}
.drop-hint.on{display:flex}
.find-panel{position:absolute;top:14px;right:22px;z-index:30;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px;width:330px}
.find-panel .row{grid-template-columns:52px 1fr}
.find-panel .find-h{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:12.5px}
.find-info{font-size:11.5px;color:var(--muted)}
/* 레이아웃 프리셋 */
.lp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lp{border:1.5px solid var(--border);border-radius:11px;padding:10px;background:var(--panel-2);text-align:center;font-size:11.5px;font-weight:600;color:var(--muted)}
.lp:hover{border-color:var(--border-strong)}
.lp.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);color:var(--accent)}
.mini{display:grid;gap:3px;height:62px;margin-bottom:8px}
.mini div{background:var(--border-strong);border-radius:3px}
.mini .m{background:var(--accent);opacity:.8}
.lay-preview{height:170px;display:grid;gap:5px;padding:8px;border-radius:10px;background:var(--panel-2);border:1px solid var(--border)}
.lay-preview div{border-radius:6px;background:var(--border-strong);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.lay-preview .m{background:var(--accent-soft);color:var(--accent);border:1.5px solid var(--accent)}
.reg-checks{display:flex;flex-wrap:wrap;gap:14px;margin:16px 0 4px}
/* 표 크기 선택기 */
.tpick{display:grid;grid-template-columns:repeat(10,20px);gap:3px}
.tpick span{width:20px;height:20px;border:1px solid var(--border-strong);border-radius:3px;background:var(--input);cursor:pointer}
.tpick span.on{background:var(--accent-soft);border-color:var(--accent)}
.tpick-label{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
.chars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.chars button{height:34px;border:1px solid var(--border);background:var(--panel-2);border-radius:6px;font-size:16px}
.chars button:hover{border-color:var(--accent-2);background:var(--accent-soft)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:1180px){.app{--lw:210px;--rw:300px}.brand-sub{display:none}}
@media (max-width:960px){.app{--lw:0px}.docname{display:none}.top-actions .lbl{display:none}}
@media (max-width:720px){.app{--rw:0px}.seg button .lbl{display:none}}
@media print{body{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- ===== 상단바 ===== -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" data-i="logo"></div>
      <div>
        <div class="brand-title">HTML Studio</div>
        <div class="brand-sub">Visual HTML Editor</div>
      </div>
    </div>
    <div class="docname">
      <span class="dirty-dot" id="dirtyDot" title="저장되지 않은 변경 사항"></span>
      <input id="docName" value="untitled.html" spellcheck="false" aria-label="파일 이름">
    </div>
    <div class="spacer"></div>
    <div class="seg" id="viewSeg" role="tablist">
      <button data-view="design" class="on"><span data-i="edit"></span><span class="lbl">디자인</span></button>
      <button data-view="source"><span data-i="code"></span><span class="lbl">HTML 소스</span></button>
      <button data-view="preview"><span data-i="eye"></span><span class="lbl">미리보기</span></button>
    </div>
    <div class="spacer"></div>
    <div class="top-actions">
      <button class="btn ghost" id="btnNew" data-tip="새 문서"><span data-i="file"></span><span class="lbl">새 문서</span></button>
      <button class="btn" id="btnOpen" data-tip="HTML 파일 열기 (Ctrl+O)"><span data-i="folder"></span><span class="lbl">열기</span></button>
      <button class="btn" id="btnPaste" data-tip="HTML 코드 붙여넣기"><span data-i="clipboard"></span><span class="lbl">붙여넣기</span></button>
      <button class="btn" id="btnTheme" data-tip="화이트 / 네이비 모드"><span data-i="moon" id="themeIcon"></span><span class="lbl" id="themeLabel">네이비</span></button>
      <button class="btn primary" id="btnDownload"><span data-i="download"></span><span class="lbl">다운로드</span><span data-i="chev"></span></button>
    </div>
  </header>

  <!-- ===== 도구 모음 ===== -->
  <div class="toolbar" id="toolbar">
    <div class="tg">
      <button class="tb" data-act="undo" id="tbUndo" data-tip="실행 취소 (Ctrl+Z)"><span data-i="undo"></span></button>
      <button class="tb" data-act="redo" id="tbRedo" data-tip="다시 실행 (Ctrl+Y)"><span data-i="redo"></span></button>
    </div>
    <div class="tg">
      <select class="tsel" id="selBlock" title="문단 형식"></select>
      <select class="tsel" id="selFont" title="글꼴"></select>
      <button class="tb" data-act="fontDown" data-tip="글자 작게">A−</button>
      <input class="tnum" id="inpSize" type="number" min="1" max="400" value="16" title="글자 크기(px)">
      <button class="tb" data-act="fontUp" data-tip="글자 크게">A+</button>
    </div>
    <div class="tg">
      <button class="tb" data-cmd="bold" data-tip="굵게 (Ctrl+B)"><span data-i="bold"></span></button>
      <button class="tb" data-cmd="italic" data-tip="기울임 (Ctrl+I)"><span data-i="italic"></span></button>
      <button class="tb" data-cmd="underline" data-tip="밑줄 (Ctrl+U)"><span data-i="underline"></span></button>
      <button class="tb" data-cmd="strikeThrough" data-tip="취소선"><span data-i="strike"></span></button>
      <button class="tb" data-cmd="superscript" data-tip="위 첨자"><span data-i="sup"></span></button>
      <button class="tb" data-cmd="subscript" data-tip="아래 첨자"><span data-i="sub"></span></button>
      <button class="tb" data-act="inlineCode" data-tip="인라인 코드"><span data-i="code"></span></button>
      <button class="tb" id="tbColor" data-act="color" data-tip="글자 색"><span data-i="type"></span><i class="sw" id="swColor"></i></button>
      <button class="tb" id="tbHilite" data-act="hilite" data-tip="글자 배경(형광펜)"><span data-i="highlight"></span><i class="sw" id="swHilite" style="background:#fff200"></i></button>
    </div>
    <div class="tg">
      <button class="tb" data-cmd="justifyLeft" data-tip="왼쪽 정렬"><span data-i="alignLeft"></span></button>
      <button class="tb" data-cmd="justifyCenter" data-tip="가운데 정렬"><span data-i="alignCenter"></span></button>
      <button class="tb" data-cmd="justifyRight" data-tip="오른쪽 정렬"><span data-i="alignRight"></span></button>
      <button class="tb" data-cmd="justifyFull" data-tip="양쪽 정렬"><span data-i="alignJustify"></span></button>
      <select class="tsel" id="selLine" title="줄 간격" style="width:78px"></select>
    </div>
    <div class="tg">
      <button class="tb" data-cmd="insertUnorderedList" data-tip="글머리 기호"><span data-i="ul"></span></button>
      <button class="tb" data-cmd="insertOrderedList" data-tip="번호 매기기"><span data-i="ol"></span></button>
      <button class="tb" data-cmd="outdent" data-tip="내어쓰기"><span data-i="outdent"></span></button>
      <button class="tb" data-cmd="indent" data-tip="들여쓰기"><span data-i="indent"></span></button>
      <button class="tb" data-act="quote" data-tip="인용문"><span data-i="quote"></span></button>
    </div>
    <div class="tg">
      <button class="tb" data-act="link" data-tip="하이퍼링크 (Ctrl+K)"><span data-i="link"></span></button>
      <button class="tb" data-act="unlink" data-tip="링크 제거"><span data-i="unlink"></span></button>
      <button class="tb" data-act="image" data-tip="이미지 삽입"><span data-i="image"></span></button>
      <button class="tb" data-act="audio" data-tip="오디오 삽입"><span data-i="audio"></span></button>
      <button class="tb" data-act="video" data-tip="비디오 삽입"><span data-i="video"></span></button>
      <button class="tb" data-act="table" data-tip="표 삽입"><span data-i="table"></span></button>
      <button class="tb" data-act="hr" data-tip="가로 구분선"><span data-i="hr"></span></button>
      <button class="tb" data-act="chars" data-tip="특수 문자"><span data-i="omega"></span></button>
    </div>
    <div class="tg">
      <button class="tb" data-act="layout" data-tip="페이지 영역 나누기"><span data-i="layout"></span></button>
      <button class="tb" data-act="find" data-tip="찾기 / 바꾸기 (Ctrl+F)"><span data-i="search"></span></button>
      <button class="tb" data-act="clear" data-tip="서식 지우기"><span data-i="eraser"></span></button>
      <button class="tb" data-act="guides" id="tbGuides" data-tip="표·영역 안내선"><span data-i="grid"></span></button>
    </div>
    <div class="tg">
      <button class="tb" data-act="toggleLeft" id="tbLeft" data-tip="문서 구조 패널"><span data-i="panelLeft"></span></button>
      <button class="tb" data-act="toggleRight" id="tbRight" data-tip="속성 패널"><span data-i="panelRight"></span></button>
      <button class="tb" data-act="fullscreen" data-tip="전체 화면"><span data-i="maximize"></span></button>
    </div>
  </div>

  <!-- ===== 본문 ===== -->
  <div class="main">
    <aside class="panel left" id="leftPanel">
      <div class="panel-h"><span>문서 구조</span>
        <span>
          <button class="icon-btn" id="btnTreeExpand" title="모두 펼치기"><span data-i="chev"></span></button>
          <button class="icon-btn" id="btnTreeCollapse" title="모두 접기"><span data-i="chevR"></span></button>
        </span>
      </div>
      <div class="panel-b"><div class="tree" id="tree"></div></div>
    </aside>

    <section class="center" id="center">
      <div class="canvas-wrap" id="canvasWrap">
        <div class="page-frame" id="pageFrame">
          <iframe id="editorFrame" title="편집 영역"></iframe>
          <div class="overlay" id="overlay">
            <div class="hover-box" id="hoverBox"></div>
            <div class="sel-box" id="selBox"><span class="sel-tag" id="selTag"></span></div>
            <div class="hd" data-dir="nw"></div><div class="hd" data-dir="n"></div><div class="hd" data-dir="ne"></div>
            <div class="hd" data-dir="e"></div><div class="hd" data-dir="se"></div><div class="hd" data-dir="s"></div>
            <div class="hd" data-dir="sw"></div><div class="hd" data-dir="w"></div>
            <div class="size-tip" id="sizeTip"></div>
          </div>
        </div>
      </div>

      <div class="source-wrap hidden" id="sourceWrap">
        <div class="sub-bar">
          <button class="btn sm primary" id="btnApplySource"><span data-i="check"></span>디자인에 적용</button>
          <button class="btn sm" id="btnFormatSource"><span data-i="alignLeft"></span>코드 정렬</button>
          <button class="btn sm" id="btnCopySource"><span data-i="copy"></span>복사</button>
          <span class="state" id="srcState">HTML 코드를 직접 수정할 수 있습니다.</span>
        </div>
        <div class="code">
          <div class="gutter" id="gutter">1</div>
          <textarea id="codeArea" spellcheck="false" wrap="off" aria-label="HTML 소스"></textarea>
        </div>
      </div>

      <div class="preview-wrap hidden" id="previewWrap">
        <div class="sub-bar">
          <button class="btn sm" id="btnPreviewRefresh"><span data-i="refresh"></span>새로 고침</button>
          <label class="chk" title="신뢰할 수 있는 문서에서만 켜세요"><input type="checkbox" id="chkPreviewScripts"> 스크립트 실행 (격리된 샌드박스)</label>
          <span class="state">저장될 최종 결과 화면입니다.</span>
        </div>
        <div class="preview-body" id="previewBody"><iframe id="previewFrame" sandbox="" title="미리보기"></iframe></div>
      </div>

      <div class="find-panel hidden" id="findPanel">
        <div class="find-h"><span>찾기 / 바꾸기</span><button class="icon-btn" id="btnFindClose"><span data-i="x"></span></button></div>
        <div class="row"><label>찾기</label><input class="inp" id="findQ" placeholder="찾을 내용"></div>
        <div class="row"><label>바꾸기</label><input class="inp" id="findR" placeholder="바꿀 내용"></div>
        <div class="btn-row" style="align-items:center">
          <label class="chk"><input type="checkbox" id="findCase"> 대소문자 구분</label>
          <span class="spacer"></span><span class="find-info" id="findInfo"></span>
        </div>
        <div class="btn-row">
          <button class="btn sm" id="btnFindPrev">이전</button>
          <button class="btn sm primary" id="btnFindNext">다음 찾기</button>
          <button class="btn sm" id="btnReplace">바꾸기</button>
          <button class="btn sm" id="btnReplaceAll">모두 바꾸기</button>
        </div>
      </div>
    </section>

    <aside class="panel right" id="rightPanel">
      <div class="tabs" id="inspTabs">
        <button data-tab="el" class="on"><span data-i="sliders"></span>요소 속성</button>
        <button data-tab="doc"><span data-i="file"></span>문서 설정</button>
      </div>
      <div class="panel-b" id="inspEl"></div>
      <div class="panel-b hidden" id="inspDoc"></div>
    </aside>
  </div>

  <!-- ===== 상태바 ===== -->
  <footer class="statusbar">
    <div class="crumbs" id="crumbs"></div>
    <span class="st-item" id="stCount">글자 0</span>
    <div class="seg sm" id="devSeg" title="화면 폭">
      <button data-dev="desktop" class="on" title="데스크톱"><span data-i="monitor"></span></button>
      <button data-dev="tablet" title="태블릿 (820px)"><span data-i="tablet"></span></button>
      <button data-dev="mobile" title="모바일 (390px)"><span data-i="phone"></span></button>
    </div>
    <span class="st-item" id="stSave">준비됨</span>
  </footer>
</div>

<input type="file" id="fileOpen" accept=".html,.htm,.xhtml,.txt,text/html" class="hidden">
<div class="shield" id="shield"></div>
<div class="drop-hint" id="dropHint">파일을 여기에 놓으세요 · HTML 문서 / 이미지 / 오디오 / 비디오</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

/* 안전한 DOM 생성기 (사용자 데이터는 항상 textContent / 속성으로만 주입 → XSS 방지) */
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  let val=null,chk=null;
  if(attrs){
    for(const k in attrs){
      const v=attrs[k];
      if(v==null||v===false) continue;
      if(k==='class') el.className=v;
      else if(k==='style') el.style.cssText=v;
      else if(k==='text') el.textContent=v;
      else if(k==='value') val=v;
      else if(k==='checked') chk=!!v;
      else if(k.startsWith('on')&&typeof v==='function') el.addEventListener(k.slice(2),v);
      else el.setAttribute(k,v===true?'':String(v));
    }
  }
  for(const c of kids.flat(2)){ if(c==null||c===false) continue; el.append(c.nodeType?c:String(c)); }
  if(val!==null) el.value=val;
  if(chk!==null) el.checked=chk;
  return el;
}

const modalStack=[];
function openModal({title,iconName,body,buttons,wide,onClose,footerLeft}){
  const bg=h('div',{class:'modal-bg'});
  const m=h('div',{class:'modal'+(wide?' wide':''),role:'dialog','aria-modal':'true'});
  let closed=false;
  const api={close(){ if(closed) return; closed=true; bg.remove(); const i=modalStack.indexOf(api); if(i>=0) modalStack.splice(i,1); if(onClose) onClose(); },el:m};
  const head=h('div',{class:'modal-h'},iconName?icon(iconName):null,h('h3',{text:title}),h('button',{class:'icon-btn',type:'button','aria-label':'닫기',onclick:()=>api.close()},icon('x')));
  const foot=h('div',{class:'modal-f'});
  if(footerLeft){ foot.append(footerLeft, h('span',{class:'spacer'})); }
  (buttons||[]).forEach(b=>{
    const btn=h('button',{class:'btn'+(b.primary?' primary':'')+(b.danger?' danger':''),type:'button'},b.label);
    btn.addEventListener('click',async()=>{ const r=b.onClick?await b.onClick(api):undefined; if(r!==false) api.close(); });
    foot.append(btn);
  });
  m.append(head,h('div',{class:'modal-b'},body),foot);
  bg.append(m);
  let downOnBg=false;
  bg.addEventListener('mousedown',e=>{downOnBg=e.target===bg;});
  bg.addEventListener('mouseup',e=>{ if(downOnBg&&e.target===bg) api.close(); downOnBg=false; });
  document.body.append(bg);
  modalStack.push(api);
  closePop();
  setTimeout(()=>{const f=m.querySelector('input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]),textarea,select');if(f) f.focus();},30);
  return api;
}

let popEl=null,popAnchor=null;
function closePop(){ if(popEl){popEl.remove();popEl=null;popAnchor=null;document.removeEventListener('mousedown',popOutside,true);} }

function openPop(anchor,content,{x,y}={}){
  closePop();
  popEl=h('div',{class:'pop'},content); popAnchor=anchor||null;
  document.body.append(popEl);
  const pw=popEl.offsetWidth,ph=popEl.offsetHeight;
  let left,top;
  if(anchor){const r=anchor.getBoundingClientRect();left=r.left;top=r.bottom+6;if(left+pw>innerWidth-8) left=r.right-pw;}
  else {left=x;top=y;}
  left=clamp(left,8,innerWidth-pw-8); if(top+ph>innerHeight-8) top=Math.max(8,(anchor?anchor.getBoundingClientRect().top-ph-6:innerHeight-ph-8));
  popEl.style.left=left+'px'; popEl.style.top=top+'px';
  setTimeout(()=>document.addEventListener('mousedown',popOutside,true),0);
  return popEl;
}
function menuPop(anchor,items,pos){
  const box=h('div',{class:'menu'});
  items.forEach(it=>{
    if(it==='-'){box.append(h('hr'));return;}
    if(!it) return;
    const b=h('button',{type:'button',class:it.danger?'danger':''},it.icon?icon(it.icon):h('span',{class:'ic',style:'width:15px'}),h('span',{text:it.label}),it.key?h('span',{class:'k',text:it.key}):null);
    if(it.disabled) b.disabled=true;
    b.addEventListener('mousedown',e=>e.preventDefault());
    b.addEventListener('click',()=>{closePop();it.run();});
    box.append(b);
  });
  return openPop(anchor,box,pos);

/* 스크립트/이벤트 핸들러/새로고침 메타를 "비활성 상태로 보존" (저장 시 원상 복원) */
function neutralize(root){
  const els=root.nodeType===1?[root,...root.querySelectorAll('*')]:Array.from(root.querySelectorAll('*'));
  for(const el of els){
    if(el.tagName==='SCRIPT'&&el.getAttribute('type')!=='text/hde-inert'){
      if(el.hasAttribute('type')) el.setAttribute('data-hde-type',el.getAttribute('type'));
      el.setAttribute('type','text/hde-inert');
    }
    if(!el.attributes.length) continue;
    for(const a of Array.from(el.attributes)){
      const n=a.name.toLowerCase();
      if(n.length>2&&n.startsWith('on')){
        el.removeAttribute(a.name);
        try{el.setAttribute('data-hde-on-'+n.slice(2),a.value);}catch(e){}
      }else if(n==='http-equiv'&&/refresh|content-security-policy|set-cookie/i.test(a.value)&&!el.hasAttribute('data-hde')){
        el.removeAttribute(a.name); el.setAttribute('data-hde-http-equiv',a.value);
      }
    }
  }
  return root;
}
/* 편집기 흔적 제거 + 원래 스크립트/핸들러 복원 */
function restoreNeutralized(root){
  const els=root.nodeType===1?[root,...root.querySelectorAll('*')]:Array.from(root.querySelectorAll('*'));
  for(const el of els){
    if(el.tagName==='SCRIPT'&&el.getAttribute('type')==='text/hde-inert'){
      if(el.hasAttribute('data-hde-type')) el.setAttribute('type',el.getAttribute('data-hde-type')); else el.removeAttribute('type');
    }
    if(!el.attributes.length) continue;
    for(const a of Array.from(el.attributes)){
      const n=a.name;
      if(!n.startsWith('data-hde')) continue;
      const v=a.value;
      el.removeAttribute(n);
      try{
        if(n.startsWith('data-hde-on-')) el.setAttribute('on'+n.slice(12),v);
        else if(n==='data-hde-http-equiv') el.setAttribute('http-equiv',v);
      }catch(e){}
    }
  }
  return root;
}
function parseToDoc(src){
  const P=new DOMParser();
  if(/<!doctype|<html[\s>]|<head[\s>]|<body[\s>]/i.test(src)) return P.parseFromString(src,'text/html');
  const d=P.parseFromString(BLANK_DOC,'text/html'); d.body.innerHTML=src; return d;
}
function loadHTML(src,{name,keepHistory=false}={}){
  src=String(src==null?'':src);
  const m=src.match(/<!doctype[^>]*>/i); S.doctype=m?m[0]:'<!DOCTYPE html>';
  const d=parseToDoc(src);
  neutralize(d);
  const meta=d.createElement('meta'); meta.setAttribute('data-hde','1'); meta.setAttribute('http-equiv','Content-Security-Policy'); meta.setAttribute('content',CSP);
  const st=d.createElement('style'); st.setAttribute('data-hde','1'); st.textContent=EDITOR_CSS;
  d.head.prepend(meta,st);
  if(S.guides) d.documentElement.setAttribute('data-hde-guides','');

}
function cleanClone(){
  const html=doc.documentElement.cloneNode(true);

  html.querySelectorAll('[style=""]').forEach(n=>n.removeAttribute('style'));
  const body=Array.from(html.children).find(c=>c.tagName==='BODY');
  if(body){ if(S.bodyCE===null) body.removeAttribute('contenteditable'); else body.setAttribute('contenteditable',S.bodyCE); }
  return html;
}
function serialize({ensureCharset=true}={}){
  if(!doc) return '';
  const html=cleanClone();
  if(ensureCharset){
    const head=Array.from(html.children).find(c=>c.tagName==='HEAD');
    if(head){
      /* 저장 파일은 항상 UTF-8 이므로 문자셋 선언도 UTF-8로 맞춤 (EUC-KR 문서 깨짐 방지) */
      head.querySelectorAll('meta[charset]').forEach(m=>m.setAttribute('charset','UTF-8'));
      head.querySelectorAll('meta[http-equiv="Content-Type" i]').forEach(m=>m.setAttribute('content','text/html; charset=UTF-8'));

        const mc=doc.createElement('meta'); mc.setAttribute('charset','UTF-8'); head.prepend(mc);
      }
    }
  }
  return (S.doctype||'<!DOCTYPE html>')+'\n'+html.outerHTML;
}

/* =====================================================================

const HIST_MAX=100,HIST_BUDGET=60e6;
function snapshot(){
  const hc=doc.head.cloneNode(true); hc.querySelectorAll('[data-hde]').forEach(n=>n.remove());
  const attrs=[];for(const a of doc.body.attributes){ if(a.name!=='contenteditable') attrs.push([a.name,a.value]); }
  const hattrs=[];for(const a of doc.documentElement.attributes){ if(!a.name.startsWith('data-hde')) hattrs.push([a.name,a.value]); }
  return {head:hc.innerHTML,body:doc.body.innerHTML.replace(/ data-hde-sel=""/g,''),attrs:JSON.stringify(attrs),html:JSON.stringify(hattrs)};
}
function commit(){
  if(!doc||S.restoring) return;
  if(S.typingTimer){clearTimeout(S.typingTimer);S.typingTimer=0;}
  const s=snapshot(),cur=S.hist[S.hi];
  if(cur&&cur.body===s.body&&cur.head===s.head&&cur.attrs===s.attrs&&cur.html===s.html) return;
  S.hist.length=S.hi+1; S.hist.push(s);
  let total=0; for(const x of S.hist) total+=x.body.length+x.head.length;
  while(S.hist.length>1&&(S.hist.length>HIST_MAX||total>HIST_BUDGET)){const x=S.hist.shift();total-=x.body.length+x.head.length;}
  S.hi=S.hist.length-1;
  setDirty(true); updateUndoButtons(); scheduleAutosave();
}
function flushTyping(){ if(S.typingTimer){clearTimeout(S.typingTimer);S.typingTimer=0;commit();} }
function restoreSnap(s){

  Array.from(doc.body.attributes).forEach(a=>{ if(a.name!=='contenteditable') doc.body.removeAttribute(a.name); });
  JSON.parse(s.attrs).forEach(([k,v])=>{try{doc.body.setAttribute(k,v);}catch(e){}});
  Array.from(doc.documentElement.attributes).forEach(a=>{ if(!a.name.startsWith('data-hde')) doc.documentElement.removeAttribute(a.name); });
  JSON.parse(s.html).forEach(([k,v])=>{try{doc.documentElement.setAttribute(k,v);}catch(e){}});
  doc.body.innerHTML=s.body;
  S.restoring=false; S.selEl=null; S.lockMedia=false; S.savedRange=null;

function undo(){ if(!doc) return; flushTyping(); if(S.hi<=0){toast('더 이상 되돌릴 작업이 없습니다.');return;} S.hi--; restoreSnap(S.hist[S.hi]); }

function startResize(e){

  const dir=e.currentTarget.dataset.dir; const r=el.getBoundingClientRect();
  const st={x:e.clientX,y:e.clientY,w:r.width,h:r.height,ratio:r.width/(r.height||1),dir,el,keep:/^(IMG|VIDEO|CANVAS|IFRAME|EMBED|OBJECT|SVG)$/i.test(el.tagName)};

    const dx=ev.clientX-st.x,dy=ev.clientY-st.y;

  }
  if(S.selCells.length>1&&/^(bold|italic|underline|strikeThrough|removeFormat|superscript|subscript)$/.test(cmd)){

    S.selCells.forEach(c=>{ const r=doc.createRange(); r.selectNodeContents(c); const sel=win.getSelection(); sel.removeAllRanges(); sel.addRange(r); try{doc.execCommand(cmd,false,val);}catch(e){} });

/* 선택 영역에 인라인 스타일 적용 (font 태그 트릭 → span style 변환) */
function applyInlineStyle(prop,value){
  if(!doc) return;
  flushTyping();
  if(S.selCells.length>1){
    const p=(prop==='background-color')?'background-color':prop;
    S.selCells.forEach(c=>{ if(value) c.style.setProperty(p,value); else c.style.removeProperty(p); });
    commit(); renderInspector(); return;
  }
  focusEditor();
  const sel=win.getSelection();
  const r=sel&&sel.rangeCount?sel.getRangeAt(0):null;
  if(!r||r.collapsed||!inBody(r.commonAncestorContainer)){
    const el=S.selEl&&S.selEl!==doc.body?S.selEl:null;
    if(!el){ toast('서식을 적용할 텍스트를 선택하거나 요소를 클릭하세요.'); return; }
    if(value) el.style.setProperty(prop,value); else el.style.removeProperty(prop);
    if(el.getAttribute('style')==='') el.removeAttribute('style');
    commit(); renderInspector(); updateToolbarState(); return;
  }
  const keep=Array.from(doc.querySelectorAll('font[size="7"]')); keep.forEach(f=>f.setAttribute('data-hde-keep',''));
  try{ doc.execCommand('styleWithCSS',false,false); doc.execCommand('fontSize',false,'7'); }catch(e){}

  const spans=[];
  doc.querySelectorAll('font[size="7"]:not([data-hde-keep])').forEach(f=>{
    const span=doc.createElement('span');
    if(f.getAttribute('color')) span.style.color=f.getAttribute('color');
    if(f.getAttribute('face')) span.style.fontFamily=f.getAttribute('face');
    if(f.getAttribute('style')) span.style.cssText+=';'+f.getAttribute('style');
    span.style.removeProperty('font-size');
    if(value) span.style.setProperty(prop,value);
    f.querySelectorAll('[style]').forEach(d=>{ d.style.removeProperty(prop); if(d.getAttribute('style')==='') d.removeAttribute('style'); });
    while(f.firstChild) span.appendChild(f.firstChild);
    f.replaceWith(span);
    if(!span.getAttribute('style')){ const p=span.parentNode; while(span.firstChild) p.insertBefore(span.firstChild,span); span.remove(); }
    else spans.push(span);
  });

const TREE_SKIP=new Set(['SCRIPT','STYLE','META','LINK','TEMPLATE','NOSCRIPT','BR','TITLE']);
const TREE_MAX=3500;
function buildTree(){
  const box=$('#tree'); if(!doc||$('#app').classList.contains('hide-left')) return;
  const frag=document.createDocumentFragment(); const map=[]; let count=0,cut=false;
  const walk=(el,depth)=>{
    if(count>=TREE_MAX){cut=true;return;}
    count++; const idx=map.push(el)-1;
    const kids=Array.from(el.children).filter(k=>!TREE_SKIP.has(k.tagName));
    const collapsed=S.treeCollapsed.has(el);
    const cls=el.classList&&el.classList.length?'.'+Array.from(el.classList).slice(0,2).join('.'):'';
    let txt='';
    if(!kids.length){ txt=(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,28); if(!txt&&el.tagName==='IMG') txt=el.getAttribute('alt')||''; }
    const row=h('div',{class:'tn'+(el===S.selEl?' sel':''),'data-idx':idx,style:'padding-left:'+(8+depth*13)+'px'},
      h('span',{class:'tw'+(kids.length&&!collapsed?' open':''),'data-tog':kids.length?'1':null,text:kids.length?'▶':''}),
      h('span',{class:'tt',text:el.tagName.toLowerCase()}),
      el.id?h('span',{class:'ti',text:'#'+el.id}):null,
      cls?h('span',{class:'tc',text:cls}):null,
      txt?h('span',{class:'tx',text:txt}):null);
    frag.append(row);
    if(!collapsed) for(const k of kids){ walk(k,depth+1); if(cut) return; }
  };
  walk(doc.body,0);
  if(cut) frag.append(h('div',{class:'tree-more',text:'요소가 많아 일부만 표시합니다 ('+TREE_MAX+'개)'}));
  S.treeMap=map; box.replaceChildren(frag);
}

function setStyle(el,prop,val,{silent=false,commitNow=true}={}){

function parseDecls(css){
  const out=[]; let buf='',depth=0,q='';
  const push=s=>{ const i=s.indexOf(':'); if(i<0) return; const p=s.slice(0,i).trim(); let v=s.slice(i+1).trim(); if(!p) return; let imp=false; const mm=v.match(/\s*!important\s*$/i); if(mm){imp=true;v=v.slice(0,mm.index);} out.push({prop:p,value:v,imp}); };
  for(const ch of css){
    if(q){ buf+=ch; if(ch===q) q=''; continue; }
    if(ch==='"'||ch==="'"){ q=ch; buf+=ch; continue; }
    if(ch==='(') depth++; else if(ch===')') depth=Math.max(0,depth-1);
    if(ch===';'&&depth===0){ push(buf); buf=''; continue; }

  if(/^(href|src|action|formaction|xlink:href|poster|data|srcdoc)$/.test(lower)&&lower!=='srcdoc'&&safeUrl(value,{allowDataAny:lower==='src'&&el.tagName==='IMG'})===null){ toast('보안상 javascript:/vbscript: 등 스크립트 URL은 사용할 수 없습니다.','err'); return false; }

function replaceTag(el,tag){
  const n=doc.createElement(tag);
  for(const a of Array.from(el.attributes)) n.setAttribute(a.name,a.value);
  while(el.firstChild) n.appendChild(el.firstChild);
  el.replaceWith(n); return n;
}
function moveEl(el,dir){
  flushTyping();
  if(dir<0){ const pv=el.previousElementSibling; if(!pv){toast('맨 위 요소입니다.');return;} pv.before(el); }
  else { const nx=el.nextElementSibling; if(!nx){toast('맨 아래 요소입니다.');return;} nx.after(el); }
  commit(); updateOverlay(); buildTree(); markTreeSel(true);
}
function duplicateEl(el){ flushTyping(); const c=el.cloneNode(true); c.removeAttribute('id'); c.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id')); c.removeAttribute('data-hde-sel'); c.querySelectorAll('[data-hde-sel]').forEach(x=>x.removeAttribute('data-hde-sel')); el.after(c); commit(); setSelected(c); buildTree(); toast('요소를 복제했습니다. (id 속성은 중복 방지를 위해 제거)'); }
function wrapEl(el){ flushTyping(); const w=doc.createElement('div'); el.before(w); w.append(el); commit(); setSelected(w); buildTree(); }
function addParagraphAfter(el){ flushTyping(); const p=doc.createElement('p'); p.innerHTML='<br>'; const t=(el.tagName==='TD'||el.tagName==='TH'||el.tagName==='LI')?null:el; if(t) t.after(p); else el.append(p); commit(); S.lockMedia=false; placeCaretIn(p); setSelected(p); buildTree(); }

function renderAttrTable(el,box){
  box.textContent='';
  const t=h('table',{class:'kv'});
  listAttrs(el).forEach(a=>{
    const nameI=h('input',{class:'inp'+(a.handler?' handler':''),value:a.name,spellcheck:'false',title:a.handler?'편집 중에는 비활성 상태로 보존됩니다':a.name});
    let valCtl;
    if(a.value.length>4000){
      valCtl=h('button',{class:'btn sm',type:'button',style:'width:100%',text:'긴 값 편집 ('+fmtBytes(a.value.length)+')'});
      valCtl.addEventListener('click',()=>openLongValueDialog(el,a));
    }else{
      valCtl=h('input',{class:'inp',value:a.value,spellcheck:'false'});
      valCtl.addEventListener('change',()=>{ if(setAttr(el,a.name,valCtl.value)){ if(a.real!==a.name&&!a.real.startsWith('data-hde-')) el.removeAttribute(a.real); commit(); afterAttrChange(el,a.name); } });
      valCtl.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); valCtl.blur(); } });
    }
    nameI.addEventListener('change',()=>{
      const nn=nameI.value.trim(); if(!nn||nn===a.name){ nameI.value=a.name; return; }
      if(setAttr(el,nn,a.value)){ el.removeAttribute(a.real); commit(); afterAttrChange(el,nn); } else nameI.value=a.name;
    });
    nameI.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); nameI.blur(); } });
    const del=iconBtn('trash','속성 삭제',()=>{ el.removeAttribute(a.real); commit(); afterAttrChange(el,a.name); },{danger:true});
    t.append(h('tr',null,h('td',null,nameI),h('td',null,valCtl),h('td',null,del)));
  });
  const nn=h('input',{class:'inp',placeholder:'새 속성',spellcheck:'false'}),nv=h('input',{class:'inp',placeholder:'값',spellcheck:'false'});
  const add=()=>{ const n=nn.value.trim(); if(!n) { nn.focus(); return; } if(setAttr(el,n,nv.value)){ commit(); afterAttrChange(el,n); } };
  nv.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } });
  nn.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); nv.focus(); } });
  t.append(h('tr',{class:'add'},h('td',null,nn),h('td',null,nv),h('td',null,iconBtn('plus','속성 추가',add))));
  if(!listAttrs(el).length) box.append(h('div',{class:'hint',style:'margin-top:4px',text:'설정된 속성이 없습니다.'}));
  box.append(t);
}
function afterAttrChange(el,name){
  const n=String(name).toLowerCase();

  if(n==='id'||n==='class') buildTree();
  renderCrumbs();
}
function openLongValueDialog(el,a){

}
function renderStyleTable(el,box){

  decls.forEach(d=>{
    const pI=h('input',{class:'inp',value:d.prop,spellcheck:'false'});
    const full=d.value+(d.imp?' !important':'');
    let vI;
    if(full.length>3000){ vI=h('input',{class:'inp',value:full.slice(0,60)+'… ('+fmtBytes(full.length)+')',disabled:true}); }
    else{ vI=h('input',{class:'inp',value:full,spellcheck:'false'}); vI.addEventListener('change',()=>{ setStyle(el,d.prop,vI.value); }); vI.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); vI.blur(); } }); }
    pI.addEventListener('change',()=>{ const np=pI.value.trim().toLowerCase(); if(!np||np===d.prop){ pI.value=d.prop; return; } el.style.removeProperty(d.prop); setStyle(el,np,full); renderInspector(); });
    pI.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); pI.blur(); } });
    const del=iconBtn('trash','스타일 삭제',()=>{ el.style.removeProperty(d.prop); if(el.getAttribute('style')==='') el.removeAttribute('style'); commit(); updateOverlay(); renderInspector(); },{danger:true});
    t.append(h('tr',null,h('td',null,pI),h('td',null,vI),h('td',null,del)));
  });
  const np=h('input',{class:'inp',placeholder:'속성 (예: color)',spellcheck:'false',list:'cssProps'}),nv=h('input',{class:'inp',placeholder:'값',spellcheck:'false'});
  const add=()=>{ const p=np.value.trim(); if(!p){np.focus();return;} if(!nv.value.trim()){nv.focus();return;} if(setStyle(el,p,nv.value)) renderInspector(); };
  nv.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } });
  np.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); nv.focus(); } });
  t.append(h('tr',{class:'add'},h('td',null,np),h('td',null,nv),h('td',null,iconBtn('plus','스타일 추가',add))));
  if(!decls.length) box.append(h('div',{class:'hint',style:'margin-top:4px',text:'인라인 스타일이 없습니다.'}));
  box.append(t);
}

function mediaSrcRow(el,attr,accept,label){

  const rep=h('button',{class:'btn sm',type:'button'},icon('folder'),'파일로 교체');
  rep.addEventListener('click',()=>pickFiles(accept,false,async files=>{ const f=files[0]; if(!f) return; busy(true,'파일을 읽는 중…'); try{ const url=await readFileAs(f,'url'); el.setAttribute(attr,url); if(el.tagName==='VIDEO'||el.tagName==='AUDIO'){ try{el.load();}catch(e){} } commit(); renderInspector(); updateOverlay(); }catch(e){ toast('파일을 읽을 수 없습니다.','err'); } finally{ busy(false); } }));
  return [row(label,ctl),h('div',{class:'btn-row'},rep)];
}

function tableGrid(table){

      const cs=Math.max(1,cell.colSpan||1);
      pos.set(cell,{r,c,rs,cs,tr});
      for(let i=0;i<rs;i++){ grid[r+i]=grid[r+i]||[]; for(let j=0;j<cs;j++) grid[r+i][c+j]=cell; }
      c+=cs;

const REG_ORDER=['top','left','main','right','footer'];

const REG_LABEL={top:'상단 영역 (Header)',left:'왼쪽 영역',main:'본문 영역',right:'오른쪽 영역',footer:'하단 영역 (Footer)'};
const REG_STYLE={top:'padding:20px 28px;background:#f4f6fa;border-bottom:1px solid #e3e8ef',left:'padding:20px;background:#f8fafc;border-right:1px solid #e3e8ef',main:'padding:28px;min-width:0',right:'padding:20px;background:#f8fafc;border-left:1px solid #e3e8ef',footer:'padding:18px 28px;background:#f4f6fa;border-top:1px solid #e3e8ef;color:#64748b;font-size:14px'};
const getLayout=()=>doc?doc.body.querySelector(':scope > [data-layout="page"]'):null;
const regionOf=(layout,r)=>layout?layout.querySelector(':scope > [data-region="'+r+'"]'):null;
function readLayoutCfg(layout){
  const cfg={top:false,left:false,right:false,footer:false,leftW:240,rightW:240,topH:0,footerH:0,gap:0,maxW:0,fullH:true};
  if(!layout) return cfg;

}
function applyLayoutGrid(layout,cfg){
  const cols=[]; if(cfg.left) cols.push(cfg.leftW+'px'); cols.push('minmax(0,1fr)'); if(cfg.right) cols.push(cfg.rightW+'px');
  const n=cols.length,mid=[]; if(cfg.left) mid.push('left'); mid.push('main'); if(cfg.right) mid.push('right');
  const areas=[],rows=[];
  if(cfg.top){ areas.push(Array(n).fill('top').join(' ')); rows.push('auto'); }
  areas.push(mid.join(' ')); rows.push('1fr');
  if(cfg.footer){ areas.push(Array(n).fill('footer').join(' ')); rows.push('auto'); }
  const s=layout.style;
  s.display='grid'; s.gridTemplateColumns=cols.join(' '); s.gridTemplateRows=rows.join(' '); s.gridTemplateAreas=areas.map(a=>'"'+a+'"').join(' ');

  if(cfg.fullH) s.minHeight='100vh'; else s.removeProperty('min-height');
  s.boxSizing='border-box';
  REG_ORDER.forEach(r=>{ const el=regionOf(layout,r); if(el){ el.style.gridArea=r; el.style.boxSizing='border-box'; } });
  const top=regionOf(layout,'top'),foot=regionOf(layout,'footer');
  if(top){ if(cfg.topH) top.style.minHeight=cfg.topH+'px'; else top.style.removeProperty('min-height'); }
  if(foot){ if(cfg.footerH) foot.style.minHeight=cfg.footerH+'px'; else foot.style.removeProperty('min-height'); }
  layout.setAttribute('data-layout-config',JSON.stringify({leftW:cfg.leftW,rightW:cfg.rightW,topH:cfg.topH,footerH:cfg.footerH,gap:cfg.gap,maxW:cfg.maxW,fullH:cfg.fullH}));
  updateLayoutResponsive(cfg);
}
function updateLayoutResponsive(cfg){
  let st=doc.head.querySelector('style[data-layout-style]');
  if(!cfg||!(cfg.left||cfg.right)){ if(st) st.remove(); return; }
  if(!st){ st=doc.createElement('style'); st.setAttribute('data-layout-style',''); doc.head.append(st); }
  const areas=REG_ORDER.filter(r=>r==='main'||cfg[r]).map(r=>'"'+r+'"').join(' ');
  st.textContent='@media (max-width: 768px){[data-layout="page"]{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:auto!important;grid-template-areas:'+areas+'!important}[data-layout="page"]>[data-region]{border-left:0!important;border-right:0!important}}';
}
const isPlaceholder=(el,r)=>el.textContent.trim()===REG_LABEL[r]&&!el.querySelector('img,video,audio,iframe,table');
function applyLayout(cfg){
  flushTyping(); clearCellSel();
  let layout=getLayout();
  const any=cfg.top||cfg.left||cfg.right||cfg.footer;
  if(!any){
    if(layout){
      const frag=doc.createDocumentFragment();
      REG_ORDER.forEach(r=>{ const el=regionOf(layout,r); if(el&&(r==='main'||(hasContent(el)&&!isPlaceholder(el,r)))){ while(el.firstChild) frag.append(el.firstChild); } if(el) el.remove(); });
      while(layout.firstChild) frag.append(layout.firstChild);
      layout.replaceWith(frag); updateLayoutResponsive(null);
    }
    commit(); S.selEl=null; renderAll(); toast('1페이지 구성으로 적용했습니다.','ok'); return;
  }
  if(!layout){
    layout=doc.createElement('div'); layout.setAttribute('data-layout','page');
    const main=doc.createElement('main'); main.setAttribute('data-region','main'); main.style.cssText=REG_STYLE.main;
    Array.from(doc.body.childNodes).filter(n=>!(n.nodeType===1&&(n.tagName==='SCRIPT'||n.tagName==='STYLE'))).forEach(n=>main.append(n));
    if(!hasContent(main)&&!main.querySelector('p')){ const p=doc.createElement('p'); p.innerHTML='<br>'; main.append(p); }
    layout.append(main); doc.body.prepend(layout);
    if(!doc.body.style.margin) doc.body.style.margin='0';
  }
  let main=regionOf(layout,'main');
  if(!main){ main=doc.createElement('main'); main.setAttribute('data-region','main'); main.style.cssText=REG_STYLE.main; main.innerHTML='<p><br></p>'; layout.append(main); }
  const regs={main};
  ['top','left','right','footer'].forEach(r=>{
    let el=regionOf(layout,r);
    if(cfg[r]&&!el){ el=doc.createElement(REG_TAGS[r]); el.setAttribute('data-region',r); el.style.cssText=REG_STYLE[r]; const p=doc.createElement('p'); p.textContent=REG_LABEL[r]; p.style.margin='0'; el.append(p); }
    if(!cfg[r]&&el){ if(hasContent(el)&&!isPlaceholder(el,r)){ const kids=Array.from(el.childNodes); if(r==='top'||r==='left') main.prepend(...kids); else main.append(...kids); } el.remove(); el=null; }
    regs[r]=el;
  });
  REG_ORDER.forEach(r=>{ if(regs[r]) layout.append(regs[r]); });
  applyLayoutGrid(layout,cfg);
  commit(); S.selEl=null; setSelected(layout); renderAll(); toast('영역 구성을 적용했습니다.','ok');
}
function miniLayout(cfg,cls){
  const n=(cfg.left?1:0)+1+(cfg.right?1:0); const cols=[]; if(cfg.left) cols.push('1fr'); cols.push('2.4fr'); if(cfg.right) cols.push('1fr');

function pickFiles(accept,multiple,cb){
  const i=h('input',{type:'file',accept,style:'display:none'}); if(multiple) i.multiple=true;
  i.addEventListener('change',()=>{ const f=Array.from(i.files||[]); i.remove(); if(f.length) cb(f); });
  document.body.append(i); i.click();
  setTimeout(()=>{ if(i.isConnected&&!i.files.length) i.remove(); },60000);
}
function field(label,ctl,hint){ return h('div',{class:'field'},h('label',{text:label}),ctl,hint?h('div',{class:'hint',text:hint}):null); }
function dropArea(accept,multiple,label,onFiles){
  const listBox=h('div',{class:'files-list'});
  const area=h('div',{class:'drop-area',tabindex:'0'},icon('download'),h('div',{style:'margin-top:6px'},h('b',{text:'클릭하여 파일 선택'}),' 또는 파일을 여기로 끌어다 놓으세요'),h('div',{class:'hint',text:label}));
  const take=files=>{ const ok=files.filter(f=>accept.split(',').some(a=>{a=a.trim(); return a.endsWith('/*')?f.type.startsWith(a.slice(0,-1)):f.type===a||f.name.toLowerCase().endsWith(a);})); if(!ok.length){ toast('지원하지 않는 파일 형식입니다.','err'); return; } listBox.replaceChildren(...ok.map(f=>h('span',{class:'fi',text:f.name+' · '+fmtBytes(f.size)}))); onFiles(multiple?ok:[ok[0]]); };
  area.addEventListener('click',()=>pickFiles(accept,multiple,take));
  area.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); area.click(); } });
  area.addEventListener('dragover',e=>{ e.preventDefault(); e.stopPropagation(); area.classList.add('over'); });
  area.addEventListener('dragleave',()=>area.classList.remove('over'));
  area.addEventListener('drop',e=>{ e.preventDefault(); e.stopPropagation(); area.classList.remove('over'); take(Array.from(e.dataTransfer.files||[])); });
  return h('div',null,area,listBox);
}
function tabsBox(tabs){
  const bar=h('div',{class:'seg m-tabs'}); const panes=h('div'); let cur=0;
  const show=i=>{ cur=i; Array.from(bar.children).forEach((b,j)=>b.classList.toggle('on',i===j)); Array.from(panes.children).forEach((p,j)=>p.classList.toggle('hidden',i!==j)); };
  tabs.forEach((t,i)=>{ const b=h('button',{type:'button',text:t.label}); b.addEventListener('click',()=>show(i)); bar.append(b); panes.append(h('div',null,t.body)); });
  show(0);
  return {el:h('div',null,bar,panes),get index(){return cur;},show};
}

function closeFind(silent){ $('#findPanel').classList.add('hidden'); if(!silent&&doc) try{ win.focus(); }catch(e){} }
function textNodes(){
  const out=[]; if(!doc) return out;
  const w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>{ const p=n.parentElement; return p&&!/^(SCRIPT|STYLE|TEXTAREA|NOSCRIPT)$/.test(p.tagName)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT; }});
  let n; while((n=w.nextNode())) out.push(n); return out;
}
function findMatches(){
  const q=$('#findQ').value; if(!q) return [];
  const cs=$('#findCase').checked; const re=new RegExp(escRe(q),cs?'g':'gi'); const out=[];
  for(const n of textNodes()){ re.lastIndex=0; let m; while((m=re.exec(n.nodeValue))){ out.push({node:n,i:m.index,len:m[0].length}); if(m[0].length===0) re.lastIndex++; } }
  return out;
}
function updateFindInfo(cur){ const n=findMatches().length; $('#findInfo').textContent=$('#findQ').value?(cur?cur+' / ':'')+n+'건':''; }
function findStep(dir){
  const ms=findMatches(); if(!ms.length){ updateFindInfo(); toast('일치하는 내용이 없습니다.'); return null; }
  const sel=win.getSelection(); let ref=null; if(sel&&sel.rangeCount&&inBody(sel.getRangeAt(0).startContainer)) ref=sel.getRangeAt(0);
  let idx;
  if(!ref) idx=dir>0?0:ms.length-1;
  else{
    const cmp=m=>{ const r=doc.createRange(); r.setStart(m.node,m.i); return r.compareBoundaryPoints(Range.START_TO_START,ref); };
    if(dir>0){ idx=ms.findIndex(m=>{ const r=doc.createRange(); r.setStart(m.node,m.i); return r.compareBoundaryPoints(Range.START_TO_END,ref)>=0&&!(m.node===ref.startContainer&&m.i===ref.startOffset&&!ref.collapsed); }); if(idx<0) idx=0; }
    else{ idx=-1; for(let i=ms.length-1;i>=0;i--){ if(cmp(ms[i])<0){ idx=i; break; } } if(idx<0) idx=ms.length-1; }
  }
  const m=ms[idx]; const r=doc.createRange(); r.setStart(m.node,m.i); r.setEnd(m.node,m.i+m.len);
  const s=win.getSelection(); s.removeAllRanges(); s.addRange(r); S.savedRange=r.cloneRange();
  try{ m.node.parentElement.scrollIntoView({block:'center',inline:'nearest'}); }catch(e){}
  updateFindInfo(idx+1);
  return m;
}
function replaceOne(){
  const q=$('#findQ').value; if(!q||!doc) return;
  const sel=win.getSelection(); const cs=$('#findCase').checked;
  if(sel&&sel.rangeCount){ const r=sel.getRangeAt(0); const t=r.toString(); if(inBody(r.startContainer)&&(cs?t===q:t.toLowerCase()===q.toLowerCase())){ flushTyping(); r.deleteContents(); const tn=doc.createTextNode($('#findR').value); r.insertNode(tn); r.setStartAfter(tn); r.collapse(true); sel.removeAllRanges(); sel.addRange(r); commit(); } }

}
function replaceAll(){

  flushTyping(); const cs=$('#findCase').checked; const re=new RegExp(escRe(q),cs?'g':'gi'); const rep=$('#findR').value; let cnt=0;
  for(const n of textNodes()){ const v=n.nodeValue; const nv=v.replace(re,()=>{ cnt++; return rep; }); if(nv!==v) n.nodeValue=nv; }
  if(cnt){ commit(); renderAll(); } toast(cnt+'건을 바꾸었습니다.',cnt?'ok':''); updateFindInfo();
}

async function decodeHtmlFile(file){
  const buf=await readFileAs(file,'buf'); const bytes=new Uint8Array(buf);
  const head=new TextDecoder('latin1').decode(bytes.subarray(0,4096));
  const m=head.match(/charset\s*=\s*["']?\s*([\w-]+)/i);
  let label=m?m[1].toLowerCase():'';
  if(/^(ks_c_5601-1987|ksc5601|euc-kr|cp949|x-windows-949|windows-949)$/.test(label)) label='euc-kr';
  const hasBom=bytes[0]===0xEF&&bytes[1]===0xBB&&bytes[2]===0xBF;
  if(!hasBom&&label&&label!=='utf-8'&&label!=='utf8'){ try{ return new TextDecoder(label).decode(bytes); }catch(e){} }
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(bytes); }
  catch(e){ try{ return new TextDecoder('euc-kr').decode(bytes); }catch(e2){ return new TextDecoder('utf-8').decode(bytes); } }
}
async function openHtmlFile(file){

async function renderViaSVG(w,hh,scale,bg){
  const clone=cleanClone(); clone.querySelectorAll('script').forEach(s=>s.remove());

/* 렌더링 결과가 바뀌지 않도록 블록 요소 사이 공백만 정리 */
const INLINE_TAGS=new Set(['A','ABBR','B','BDI','BDO','BR','CITE','CODE','DATA','DFN','EM','I','IMG','INPUT','KBD','LABEL','MARK','Q','S','SAMP','SMALL','SPAN','STRONG','SUB','SUP','TIME','U','VAR','WBR','FONT','BUTTON','SELECT','TEXTAREA','AUDIO','VIDEO','IFRAME','CANVAS','SVG','OBJECT','EMBED','PICTURE','DEL','INS','OUTPUT','METER','PROGRESS','RUBY']);
const PRESERVE_TAGS=new Set(['PRE','TEXTAREA','SCRIPT','STYLE','CODE','TITLE']);
function formatHTML(src){
  const dt=(src.match(/<!doctype[^>]*>/i)||[''])[0];
  const full=/<!doctype|<html[\s>]/i.test(src);
  const d=new DOMParser().parseFromString(full?src:'<!DOCTYPE html><html><head></head><body>'+src+'</body></html>','text/html');
  const fmt=(el,depth)=>{
    if(PRESERVE_TAGS.has(el.tagName)) return;
    const kids=Array.from(el.childNodes);
    const hasText=kids.some(k=>k.nodeType===3&&k.nodeValue.trim());
    const hasInline=kids.some(k=>k.nodeType===1&&INLINE_TAGS.has(k.tagName.toUpperCase()));
    const hasEl=kids.some(k=>k.nodeType===1);
    if(hasText||hasInline||!hasEl){ kids.forEach(k=>{ if(k.nodeType===1) fmt(k,depth+1); }); return; }
    kids.forEach(k=>{ if(k.nodeType===3) k.remove(); });
    const ind='\n'+'  '.repeat(depth+1);
    Array.from(el.childNodes).forEach(k=>{ el.insertBefore(d.createTextNode(ind),k); if(k.nodeType===1) fmt(k,depth+1); });
    el.appendChild(d.createTextNode('\n'+'  '.repeat(depth)));
  };
  if(full){ fmt(d.documentElement,0); return (dt||'<!DOCTYPE html>')+'\n'+d.documentElement.outerHTML; }
  fmt(d.body,-1); return d.body.innerHTML.replace(/^\n/,'');
}

 * 19. 도구 모음 · 상단바 바인딩
 * ===================================================================== */
(function initSelects(){
  const sb=$('#selBlock');
  [['p','본문'],['h1','제목 1'],['h2','제목 2'],['h3','제목 3'],['h4','제목 4'],['h5','제목 5'],['h6','제목 6'],['blockquote','인용문'],['pre','코드 블록'],['div','DIV 블록'],['','(기타)']].forEach(([v,l])=>sb.append(h('option',{value:v,text:l})));
  const sf=$('#selFont'); sf.append(h('option',{value:'',text:'글꼴'})); FONT_OPTS.slice(1).forEach(([v,l])=>sf.append(h('option',{value:v,text:l})));
  const sl=$('#selLine'); sl.append(h('option',{value:'',text:'줄 간격'})); ['1.0','1.2','1.4','1.5','1.6','1.8','2.0','2.5','3.0'].forEach(v=>sl.append(h('option',{value:v,text:v})));
  const dl=h('datalist',{id:'cssProps'},['color','background','background-color','background-image','font-size','font-weight','font-family','font-style','line-height','letter-spacing','text-align','text-decoration','text-shadow','text-indent','width','height','max-width','min-height','margin','padding','border','border-radius','border-color','box-shadow','display','flex-direction','justify-content','align-items','gap','grid-template-columns','position','top','left','right','bottom','z-index','opacity','overflow','float','vertical-align','white-space','cursor','transform','transition'].map(p=>h('option',{value:p})));
  document.body.append(dl);
  $$('[data-i]').forEach(el=>{ el.classList.add('ic'); el.innerHTML=svgStr(el.dataset.i); });
})();
$('#selBlock').addEventListener('change',e=>{ const v=e.target.value; if(!v) return; if(S.selCells.length>1){ toast('문단 형식은 셀 안의 커서 위치에 적용하세요.'); return; } exec('formatBlock','<'+v+'>'); renderAll(); });
$('#selFont').addEventListener('change',e=>{ const v=e.target.value; if(v) applyInlineStyle('font-family',v); });
$('#selLine').addEventListener('change',e=>{ const v=e.target.value; e.target.value=''; if(v) applyBlockStyle('line-height',v); });
const sizeIn=$('#inpSize');
function applyFontSize(v){ v=clamp(Math.round(+v||0),1,400); sizeIn.value=v; applyInlineStyle('font-size',v+'px'); }
sizeIn.addEventListener('change',()=>applyFontSize(sizeIn.value));
sizeIn.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); applyFontSize(sizeIn.value); } });
const ACTIONS={
  undo,redo,
  fontUp:()=>applyFontSize((+sizeIn.value||16)+2),fontDown:()=>applyFontSize(Math.max(1,(+sizeIn.value||16)-2)),
  inlineCode:toggleInlineCode,
  color:btn=>colorPop(btn,$('#swColor').style.background,v=>{ applyInlineStyle('color',v||''); if(v) $('#swColor').style.background=v; },{noneLabel:'기본 색으로'}),
  hilite:btn=>colorPop(btn,$('#swHilite').style.background,v=>{ applyInlineStyle('background-color',v||''); if(v) $('#swHilite').style.background=v; },{noneLabel:'배경 없음'}),
  quote:()=>{ const r=getEditRange(); const q=r&&elOf(r.startContainer)&&elOf(r.startContainer).closest('blockquote'); if(q&&inBody(q)){ exec('formatBlock','<p>'); } else { exec('formatBlock','<blockquote>'); const nq=getEditRange()&&elOf(getEditRange().startContainer)&&elOf(getEditRange().startContainer).closest('blockquote'); if(nq&&!nq.getAttribute('style')){ nq.style.cssText='margin:12px 0;padding:8px 16px;border-left:4px solid #2f5bd3;background:#f5f8ff;color:#334155'; commit(); } } renderAll(); },
  link:openLinkDialog,unlink:removeLink,
  image:()=>openImageDialog(),audio:()=>openMediaDialog('audio'),video:()=>openMediaDialog('video'),
  table:openTableDialog,hr:insertHR,chars:openCharsDialog,layout:openLayoutDialog,find:openFind,clear:clearFormat,
  guides:()=>setGuides(!S.guides),
  toggleLeft:()=>togglePanel('left'),toggleRight:()=>togglePanel('right'),
  fullscreen:()=>{ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(e){ toast('전체 화면을 지원하지 않는 환경입니다.','err'); } }
};
$('#toolbar').addEventListener('mousedown',e=>{ const b=e.target.closest('button.tb'); if(b) e.preventDefault(); });
$('#toolbar').addEventListener('click',e=>{
  const b=e.target.closest('button.tb'); if(!b||b.disabled) return;
  if(!doc){ return; }
  if(b.dataset.cmd) exec(b.dataset.cmd);
  else if(b.dataset.act&&ACTIONS[b.dataset.act]) ACTIONS[b.dataset.act](b);
});
function setGuides(on){
  S.guides=!!on; store.set('htmlStudio.guides',S.guides?'1':'0');
  $('#tbGuides').classList.toggle('on',S.guides);
  if(doc) doc.documentElement.toggleAttribute('data-hde-guides',S.guides);
  if(S.inspTab==='doc') renderDocTab();
}
function togglePanel(side){
  const app=$('#app'); const cls=side==='left'?'hide-left':'hide-right';
  app.classList.toggle(cls);
  store.set('htmlStudio.'+cls,app.classList.contains(cls)?'1':'0');
  $('#tbLeft').classList.toggle('on',!app.classList.contains('hide-left'));
  $('#tbRight').classList.toggle('on',!app.classList.contains('hide-right'));
  if(side==='left'&&!app.classList.contains('hide-left')) buildTree();
  setTimeout(updateOverlay,260);
}
$('#inspTabs').addEventListener('click',e=>{ const b=e.target.closest('button[data-tab]'); if(!b) return; S.inspTab=b.dataset.tab;
  $$('#inspTabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('#inspEl').classList.toggle('hidden',S.inspTab!=='el'); $('#inspDoc').classList.toggle('hidden',S.inspTab!=='doc');
  if(S.inspTab==='doc') renderDocTab(); else renderInspector(); });
$('#devSeg').addEventListener('click',e=>{ const b=e.target.closest('button[data-dev]'); if(!b) return; S.device=b.dataset.dev;
  $$('#devSeg button').forEach(x=>x.classList.toggle('on',x===b));
  const w={desktop:'100%',tablet:'820px',mobile:'390px'}[S.device];
  $('#pageFrame').style.width=w; $('#previewFrame').style.width=w; setTimeout(updateOverlay,280); });
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t); store.set('htmlStudio.theme',t);
  const navy=t==='navy'; $('#themeIcon').innerHTML=svgStr(navy?'sun':'moon'); $('#themeLabel').textContent=navy?'화이트':'네이비';
}
$('#btnTheme').addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='navy'?'white':'navy'));
$('#btnOpen').addEventListener('click',()=>$('#fileOpen').click());
$('#btnPaste').addEventListener('click',openPasteDialog);
$('#btnDownload').addEventListener('click',e=>{ if(popEl&&popAnchor===e.currentTarget){ closePop(); return; } openDownloadMenu(e.currentTarget); });
$('#btnNew').addEventListener('click',async()=>{ if(S.dirty&&!(await confirmBox('새 문서를 만들까요?\n저장하지 않은 변경 사항은 사라집니다.',{okLabel:'새 문서',danger:true}))) return; loadHTML(NEW_DOC,{name:'untitled.html'}); setView('design'); });
$('#docName').addEventListener('change',e=>setDocName(e.target.value));
$('#docName').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); e.target.blur(); } });

/* 상위 창 단축키 */
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey; if(!mod||e.altKey) return;
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(tag);
  const k=e.key.toLowerCase();
  if(k==='s'){ e.preventDefault(); if(S.view==='source') applySource(); exportHTML(); return; }
  if(k==='o'){ e.preventDefault(); $('#fileOpen').click(); return; }
  if(k==='p'){ e.preventDefault(); printDoc(); return; }
  if(typing) return;
  if(k==='z'&&!e.shiftKey){ e.preventDefault(); undo(); }
  else if(k==='y'||(k==='z'&&e.shiftKey)){ e.preventDefault(); redo(); }
  else if(k==='f'){ e.preventDefault(); openFind(); }
});
/* 창 전체 파일 드래그 앤 드롭 */
let dragDepth=0;
const hasFiles=e=>e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files');
window.addEventListener('dragenter',e=>{ if(!hasFiles(e)) return; dragDepth++; $('#dropHint').classList.add('on'); });
window.addEventListener('dragleave',e=>{ if(!hasFiles(e)) return; dragDepth=Math.max(0,dragDepth-1); if(!dragDepth) $('#dropHint').classList.remove('on'); });
window.addEventListener('dragover',e=>{ if(hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop',e=>{ dragDepth=0; $('#dropHint').classList.remove('on'); if(!hasFiles(e)) return; e.preventDefault(); if(modalStack.length) return; const f=Array.from(e.dataTransfer.files||[]); if(f.length) handleFiles(f); });
window.addEventListener('resize',()=>{ updateOverlay(); closePop(); });
window.addEventListener('beforeunload',e=>{ if(S.dirty){ e.preventDefault(); e.returnValue=''; } });

/* =====================================================================
 * 20. 시작
 * ===================================================================== */
(function init(){
  applyTheme(document.documentElement.getAttribute('data-theme')==='navy'?'navy':'white');
  const app=$('#app');
  if(store.get('htmlStudio.hide-left')==='1') app.classList.add('hide-left');
  if(store.get('htmlStudio.hide-right')==='1') app.classList.add('hide-right');
  $('#tbLeft').classList.toggle('on',!app.classList.contains('hide-left'));
  $('#tbRight').classList.toggle('on',!app.classList.contains('hide-right'));
  $('#tbGuides').classList.toggle('on',S.guides);
  loadHTML(WELCOME_DOC,{name:'untitled.html'});
  let saved=null; try{ saved=JSON.parse(store.get(AS_KEY)||'null'); }catch(e){ saved=null; }
  if(saved&&typeof saved.html==='string'&&saved.html.length){
    const when=new Date(saved.t||Date.now());
    const label=when.toLocaleDateString('ko-KR')+' '+when.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    setTimeout(()=>openModal({title:'이전 작업 복구',iconName:'refresh',
      body:h('div',{style:'line-height:1.75'},h('div',{text:'자동 저장된 문서가 있습니다.'}),h('div',{class:'hint',text:(saved.name||'untitled.html')+' · '+label+' · '+fmtBytes(saved.html.length)})),
      buttons:[{label:'삭제하고 새로 시작',onClick:()=>{ store.del(AS_KEY); }},{label:'그냥 시작'},{label:'복구하기',primary:true,onClick:()=>{ loadHTML(saved.html,{name:saved.name||'untitled.html'}); toast('이전 작업을 복구했습니다.','ok'); }}]}),300);
  }
})();
})();
</script>
